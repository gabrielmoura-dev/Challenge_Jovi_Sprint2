<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Onboarding — Preferências de foto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/jovi.css" rel="stylesheet">
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle style="left: 16px;">🌙 Dark</button>
  <a href="index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="phone-shell">
    <main class="phone-frame">
      <!-- Status bar -->
      <div class="jovi-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="assets/icons/status-signal.svg" alt="">
          <img src="assets/icons/status-wifi.svg" alt="">
          <img src="assets/icons/status-battery-body.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="px-4 pt-4 flex-grow-1 d-flex flex-column">
        <h1 class="fw-bold" style="font-size:20px; color:var(--jovi-text-strong);">
          O que considera uma boa foto?
        </h1>
        <p class="text-jovi-muted fw-semibold mb-3" style="font-size:16px;">
          Escolha todas que se aplicam
        </p>

        <div class="row g-2 mb-2" role="group" aria-label="Preferências de estilo">
          <div class="col-4">
            <button type="button" class="pref-tile selected" data-pref-tile aria-pressed="true">Nitidez</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile selected" data-pref-tile aria-pressed="true">Cores Vivas</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile selected" data-pref-tile aria-pressed="true">Naturalidade</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Suavidade da Pele</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Tons Frios</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Dramática</button>
          </div>
        </div>

        <div class="row g-2 mb-4">
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Alta Saturação</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Preto e Branco</button>
          </div>
          <div class="col-4">
            <button type="button" class="pref-tile" data-pref-tile aria-pressed="false">Vinheta</button>
          </div>
        </div>

        <div class="mt-auto pb-4">
          <button type="button" class="jovi-btn-primary w-100 py-3 mb-3" style="font-size:16px;">
            Começar
          </button>
          <button type="button" class="btn w-100 border-0 fw-bold text-jovi-muted" style="font-size:16px;">
            Pular
          </button>
          <div class="d-flex justify-content-center gap-2 mt-3">
            <span class="jovi-dot"></span>
            <span class="jovi-dot"></span>
            <span class="jovi-dot"></span>
            <span class="jovi-dot active"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/jovi.js"></script>
</body>
</html>
