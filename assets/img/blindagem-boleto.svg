<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4a34"/>
      <stop offset="55%" stop-color="#503524"/>
      <stop offset="100%" stop-color="#3a2519"/>
    </linearGradient>
    <linearGradient id="paperShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bankStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f9d63"/>
      <stop offset="100%" stop-color="#137a4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#wood)"/>
  <g opacity="0.15">
    <rect x="0" y="0" width="800" height="6" fill="#000"/>
    <rect x="0" y="140" width="800" height="4" fill="#000"/>
    <rect x="0" y="480" width="800" height="4" fill="#000"/>
    <rect x="0" y="860" width="800" height="4" fill="#000"/>
  </g>

  <!-- paper shadow -->
  <rect x="70" y="120" width="660" height="900" rx="14" fill="url(#paperShadow)"/>

  <!-- boleto paper -->
  <rect x="60" y="100" width="660" height="900" rx="10" fill="#f6f3ea"/>
  <rect x="60" y="100" width="660" height="900" rx="10" fill="none" stroke="#d8d2c2" stroke-width="2"/>

  <!-- bank stripe -->
