    <text x="94" y="312" font-size="24" fill="#26221c" font-weight="600">Comércio Rápido Digital Ltda.</text>

    <text x="94" y="368" font-size="18">CPF/CNPJ</text>
    <text x="94" y="400" font-size="24" fill="#26221c" font-weight="600">12.345.678/0001-90</text>

    <text x="440" y="368" font-size="18">VENCIMENTO</text>
    <text x="440" y="400" font-size="24" fill="#c33" font-weight="700">28/08/2026</text>

    <text x="94" y="456" font-size="18">NOSSO NÚMERO</text>
    <text x="94" y="488" font-size="24" fill="#26221c" font-weight="600">00089/003456-7</text>

    <text x="440" y="456" font-size="18">VALOR DO DOCUMENTO</text>
    <text x="440" y="494" font-size="30" fill="#137a4b" font-weight="800">R$ 487,90</text>
  </g>

  <rect x="94" y="530" width="612" height="2" fill="#d8d2c2"/>

  <g font-family="Arial, sans-serif" fill="#68625a">
