<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="hand-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfa27a"/>
      <stop offset="100%" stop-color="#9a6f4c"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#191c22"/>
    </linearGradient>
    <linearGradient id="pixGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32d182"/>
      <stop offset="100%" stop-color="#1a9d63"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#32d182" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#32d182" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#hand-bg)"/>
  <!-- blurred hand shape holding phone -->
  <ellipse cx="400" cy="1120" rx="420" ry="220" fill="#7a5233" opacity="0.65"/>
  <ellipse cx="220" cy="980" rx="140" ry="260" fill="#8a6040" opacity="0.55"/>
  <ellipse cx="600" cy="980" rx="140" ry="260" fill="#8a6040" opacity="0.55"/>

  <!-- phone body -->
  <rect x="130" y="90" width="540" height="980" rx="56" fill="#05060a"/>
  <rect x="146" y="106" width="508" height="948" rx="42" fill="url(#phoneScreen)"/>
  <circle cx="400" cy="1200" r="0" fill="none"/>

  <rect x="146" y="106" width="508" height="948" rx="42" fill="url(#glow)"/>

  <!-- status bar -->
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0.7">17:32</text>

  <!-- success check -->
  <circle cx="400" cy="330" r="76" fill="url(#pixGreen)"/>
  <path d="M362 332 L388 358 L442 300" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Pagamento realizado</text>
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#32d182">R$ 1.250,00</text>

  <!-- receipt card -->
  <rect x="176" y="560" width="448" height="360" rx="24" fill="#20242c"/>
  <g font-family="Arial, sans-serif">
    <text x="206" y="612" font-size="18" fill="#8a8f9c">TIPO DE CHAVE</text>
    <text x="206" y="644" font-size="24" fill="#ffffff" font-weight="600">Celular</text>

    <rect x="206" y="668" width="388" height="2" fill="#31353f"/>

    <text x="206" y="708" font-size="18" fill="#8a8f9c">CHAVE PIX</text>
    <text x="206" y="740" font-size="24" fill="#ffffff" font-weight="600">(11) 9 ****-2231</text>

    <rect x="206" y="764" width="388" height="2" fill="#31353f"/>

    <text x="206" y="804" font-size="18" fill="#8a8f9c">INSTITUIÇÃO</text>
    <text x="206" y="836" font-size="24" fill="#ffffff" font-weight="600">Banco Desconhecido S.A.</text>

    <rect x="206" y="860" width="388" height="2" fill="#31353f"/>

    <text x="206" y="900" font-size="18" fill="#8a8f9c">DATA/HORA</text>
    <text x="206" y="900" font-size="18" fill="#8a8f9c" text-anchor="end" x2="594"></text>
  </g>

  <text x="594" y="900" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">27/08/2026 17:31</text>

  <rect x="176" y="960" width="448" height="72" rx="18" fill="#2a2f38"/>
  <text x="400" y="1004" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Comprovante</text>
</svg>
