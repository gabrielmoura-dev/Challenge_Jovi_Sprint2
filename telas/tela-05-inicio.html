<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Início</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-05.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame">
      <!-- Status bar -->
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="home-scroll">
        <div class="home-header">
          <h1 class="home-greeting">Olá, <span class="text-home-primary" data-user-name>Larissa</span></h1>
          <p class="home-subtitle">Pronto para criar algo incrível hoje?</p>
        </div>

        <div class="home-banner">
          <div class="home-banner-badge">📚 Novidade</div>
          <div class="home-banner-title">IA que ensina</div>
          <div class="home-banner-subtitle">Explore novos recursos</div>
          <button type="button" class="home-banner-btn" onclick="joviNavegar('tela-08-camera-estudo.html')">Experimentar</button>
        </div>

        <div class="home-grid">
          <button type="button" class="home-card" onclick="joviNavegar('tela-13-camera.html')">
            <div class="home-card-icon icon-camera">
              <img src="../assets/img/camera.svg" alt="">
            </div>
            <div class="home-card-title">Câmera IA</div>
            <p class="home-card-subtitle">Tire fotos com IA</p>
          </button>
          <button type="button" class="home-card" onclick="joviNavegar('tela-08-camera-estudo.html')">
            <div class="home-card-icon icon-study">
              <img src="../assets/img/book-open.svg" alt="">
            </div>
            <div class="home-card-title">Modo Estudo</div>
            <p class="home-card-subtitle">Aprenda com IA</p>
          </button>
          <button type="button" class="home-card" onclick="joviNavegar('tela-06-galeria.html')">
            <div class="home-card-icon icon-gallery">
              <img src="../assets/img/image.svg" alt="">
            </div>
            <div class="home-card-title">Galeria IA</div>
            <p class="home-card-subtitle">Gerencie suas fotos</p>
          </button>
          <button type="button" class="home-card" onclick="joviNavegar('tela-10-assistente.html')">
            <div class="home-card-icon icon-assistant">
              <img src="../assets/img/cam-sparkle.svg" alt="">
            </div>
            <div class="home-card-title">Assistente IA</div>
            <p class="home-card-subtitle">Conversas</p>
          </button>
        </div>
      </div>

      <!-- Nav inferior -->
      <nav class="lacar-nav-bottom" aria-label="Navegação principal">
        <button type="button" class="btn p-0 border-0" aria-label="Início" aria-current="page">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </button>
        <button type="button" class="lacar-nav-fab" aria-label="Abrir câmera" onclick="joviNavegar('tela-13-camera.html')">
          <img src="../assets/img/nav-camera.svg" alt="">
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Diário" onclick="joviNavegar('tela-11-assistente-estudo.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Ajustes" onclick="joviNavegar('tela-17-ajustes.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script>
    // Nome salvo na Tela 02 (assets/js/script.js) durante o onboarding.
    // Sem nome salvo (ex. onboarding pulado), mantém o placeholder do design.
    (function () {
      var nameEl = document.querySelector("[data-user-name]");
      if (!nameEl) return;
      var saved = null;
      try { saved = localStorage.getItem("jovi-user-name"); } catch (e) {}
      if (saved) nameEl.textContent = saved;
    })();
  </script>
</body>
</html>
