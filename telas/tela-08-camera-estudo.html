<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Câmera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-10.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame camera-frame">
      <img src="../assets/img/camera-interface-bg.png" alt="" class="camera-bg">

      <div class="lacar-statusbar camera-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="camera-topbar">
        <div class="camera-chips">
          <button type="button" class="camera-chip chip-pose" aria-label="Pose">
            <span class="camera-chip-badge">
              <img src="../assets/img/cam-pose-badge.png" alt="">
              <span>POSE</span>
            </span>
          </button>
          <button type="button" class="camera-chip chip-guide" aria-label="Guia de leitura">
            <img src="../assets/img/book-open-text-purple.svg" alt="">
          </button>
          <button type="button" class="camera-chip chip-ai" aria-label="Melhorias IA">
            <img src="../assets/img/cam-sparkle.svg" alt="">
          </button>
          <button type="button" class="camera-chip chip-mp" aria-label="200 megapixels">
            <span class="camera-chip-badge">
              <img src="../assets/img/cam-mp-badge.png" alt="">
              <span>200 mp</span>
            </span>
          </button>
          <button type="button" class="camera-chip chip-flash" aria-label="Flash">
            <img src="../assets/img/cam-lightning.svg" alt="">
          </button>
        </div>
        <button type="button" class="camera-settings-btn" aria-label="Configurações">
          <img src="../assets/img/cam-settings.svg" alt="">
        </button>
      </div>

      <div class="camera-spacer"></div>

      <div class="camera-bottombar">
        <div class="camera-modes">
          <button type="button" class="mode-pill mode-sport active" data-camera-mode="esporte">
            <img src="../assets/img/cam-mode-sport.svg" alt="">
            <span>Esporte</span>
          </button>
          <button type="button" class="mode-pill mode-chat" data-camera-mode="chat">
            <img src="../assets/img/message-circle.svg" alt="">
            <span>Chat</span>
          </button>
          <button type="button" class="mode-pill mode-palestra" data-camera-mode="palestra">
            <img src="../assets/img/video.svg" alt="">
            <span>Palestra</span>
          </button>
          <button type="button" class="mode-pill mode-noturno" data-camera-mode="noturno">
            <img src="../assets/img/cam-mode-night.svg" alt="">
            <span>Noturno</span>
          </button>
        </div>

        <div class="camera-shutter-row">
          <button type="button" class="shutter-side-btn" aria-label="Galeria" onclick="window.location.href='tela-06-galeria.html'">
            <img src="../assets/img/cam-gallery-icon.svg" alt="">
          </button>
          <button type="button" class="shutter-btn" aria-label="Capturar foto" data-camera-shutter onclick="window.location.href='tela-09-selecao-fotos-ia.html'">
            <span class="shutter-btn-inner"></span>
          </button>
          <button type="button" class="shutter-side-btn" aria-label="Alternar câmera">
            <img src="../assets/img/refresh-ccw.svg" alt="">
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
