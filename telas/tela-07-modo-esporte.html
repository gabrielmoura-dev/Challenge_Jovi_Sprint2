<div class="app-frame app-frame--camera">

  <img class="camera__preview" src="../assets/img/camera-bg-esporte.jpg"
       alt="Prévia da câmera apontada para um jogador de basquete no ar, prestes a encestar">
  <div class="camera__veil camera__veil--top" aria-hidden="true"></div>
  <div class="camera__veil camera__veil--bottom" data-camera-bar aria-hidden="true"></div>

  <div class="camera__ui">

    <div class="status-bar status-bar--on-media" aria-hidden="true">
      <span class="status-bar__time">17:32</span>
      <span class="status-bar__icons">
        <img src="../assets/img/status-signal.svg" alt="">
        <img src="../assets/img/status-wifi.svg" alt="">
        <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
      </span>
    </div>

    <div class="camera__toolbar">
      <div class="camera__tools">
        <button type="button" class="icon-button icon-button--36" aria-label="Voltar" onclick="joviVoltar('tela-05-inicio.html', event)">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Guia de pose">
          <span class="camera__badge-pose" aria-hidden="true">POSE</span>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Modo leitura">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-book-open-text"/></svg>
        </button>
        <button type="button" class="icon-button icon-button--36 camera__tool--ai" aria-label="Realce com IA">
          <svg width="20" height="20" aria-hidden="true"><use href="#i-sparkles"/></svg>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Resolução: 200 megapixels">
          <span class="camera__badge-mp" aria-hidden="true">200 mp</span>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Flash">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-zap"/></svg>
        </button>
      </div>
      <button type="button" class="icon-button icon-button--40" aria-label="Configurações da câmera">
        <svg width="20" height="20" aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
    </div>

    <p class="camera__scene">
      <span class="camera__scene-dot" aria-hidden="true"></span>
      <span class="camera__scene-label" data-camera-scene>IA monitorando pico</span>
    </p>

    <div class="camera__bursts glass">
      <span class="camera__bursts-label">Capturas de pico · 5</span>
      <div class="camera__bursts-row">
        <img class="camera__burst-thumb" src="../assets/img/camera-esporte-burst-1.jpg" alt="Captura em rajada 1 de 5">
        <img class="camera__burst-thumb" src="../assets/img/camera-esporte-burst-2.jpg" alt="Captura em rajada 2 de 5">
        <img class="camera__burst-thumb" src="../assets/img/camera-esporte-burst-3.jpg" alt="Captura em rajada 3 de 5">
        <img class="camera__burst-thumb" src="../assets/img/camera-esporte-burst-4.jpg" alt="Captura em rajada 4 de 5">
        <img class="camera__burst-thumb" src="../assets/img/camera-esporte-burst-5.jpg" alt="Captura em rajada 5 de 5">
      </div>
    </div>

    <div class="camera__panel">

      <div class="camera__modes" data-camera-modes role="group" aria-label="Modo de captura">
        <button type="button" class="camera__mode" data-camera-mode="blindagem" aria-pressed="false">Blindagem</button>
        <button type="button" class="camera__mode" data-camera-mode="estudo" aria-pressed="false">Estudo</button>
        <button type="button" class="camera__mode is-active" data-camera-mode="esporte" aria-pressed="true">Esporte</button>
        <button type="button" class="camera__mode" data-camera-mode="foto" aria-pressed="false">Foto</button>
        <button type="button" class="camera__mode" data-camera-mode="retrato" aria-pressed="false">Retrato</button>
        <button type="button" class="camera__mode" data-camera-mode="video" aria-pressed="false">Vídeo</button>
      </div>

      <div class="camera__actions">
        <button type="button" class="camera__side-button" data-camera-side aria-label="Abrir galeria" onclick="joviNavegar('tela-06-galeria.html')">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-image"/></svg>
        </button>
        <button type="button" class="camera__shutter" aria-label="Tirar foto" data-camera-shutter></button>
        <button type="button" class="camera__side-button" data-camera-side aria-label="Alternar câmera">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-refresh-ccw"/></svg>
        </button>
      </div>

    </div>

  </div>
</div>

<script src="../assets/js/toast.js"></script>
<script src="../assets/js/camera-modes.js"></script>
<script>
  // Modo Esporte: a IA já capturou as rajadas; o obturador confirma a
  // captura de pico com um toast (sem tela de revisão neste fluxo).
  (function () {
    var shutter = document.querySelector("[data-camera-shutter]");
    if (shutter) shutter.addEventListener("click", function () {
      if (window.JoviToast) window.JoviToast.show("Momento de pico salvo na galeria");
    });
  })();
</script>
</body>
