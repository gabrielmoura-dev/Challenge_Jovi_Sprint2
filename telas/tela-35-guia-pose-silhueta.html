<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Guia de pose</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/jullia-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-16.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-35.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
  <!--
    Tela nova (22), mockup de time — não vem do Figma. Estado ativo do
    guia de pose: usuário já escolheu uma referência no carrossel da
    tela 13 e agora está enquadrando ao vivo. Mesma família de
    componentes da tela 13 (jullia-componentes.css + tokens.css).

    Silhueta = mesma técnica do app referência indicado pelo time (Poze,
    ver pesquisas/sugestao-silhueta-1/2/3.png): uma LINHA fina
    e contínua com brilho suave, traçando o contorno real da foto de
    pose escolhida — não um boneco de palito, não uma forma preenchida.

    Os três traçados acompanham cabeça, tronco, braços e mãos nas fotos
    originais. A pessoa escolhe um exemplo na faixa inferior e o mesmo
    par foto/contorno aparece ampliado, alinhado pixel a pixel.

    É um asset leve e determinístico, gerado uma vez na curadoria da
    pose; modelo e vetorizador não são carregados no navegador. Fica
    branco enquanto o enquadramento não bate com a pose alvo e vira
    verde-menta (.is-aligned) quando bate; aqui mostramos o estado
    "ajustando". O halo vem de sombras do SVG sem engrossar o vetor-base.

    Guia por voz: lê o estado salvo pela tela 13 (sessionStorage) e só
    mostra a legenda se o usuário ligou o toggle lá. O áudio em si não
    dá pra demonstrar num mockup estático — a legenda existe também
    pra funcionar como caption de acessibilidade quando o áudio toca.
  -->

  <div class="phone-shell">
    <main class="phone-frame p-0">
      <div class="camera-frame">
        <!-- Preenchimento desfocado (mesma foto, cover+blur) pra cobrir a
             tarja que sobraria: a referência é quadrada (480x480) e o
             viewfinder é retrato — ver nota acima. -->
        <img src="../assets/img/camera-thumb-1.png" alt="" aria-hidden="true" class="camera-bg pose-guide-fill" data-pose-fill>

        <div class="camera-content">
          <!-- Status bar -->
          <div class="jovi-statusbar" style="background:rgba(10,10,10,0.4);">
            <span>17:32</span>
            <div class="d-flex align-items-center gap-1">
              <img src="../assets/img/status-signal.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-wifi.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-battery.svg" alt="" style="height:14px;filter:brightness(0) invert(1);">
            </div>
          </div>

          <button type="button" class="pose-guide-close" aria-label="Fechar guia de pose" onclick="joviNavegar('tela-13-camera.html')">
            <img src="../assets/img/x.svg" alt="">
          </button>

          <span class="pose-guide-pip-tag pose-guide-pip-tag--floating" data-pose-label>Dinâmica</span>

          <!-- Palco: foto de referência em tamanho real (contain, sem
               corte) + traçado alinhado pixel a pixel a ela. -->
          <div class="pose-guide-stage">
            <img src="../assets/img/camera-thumb-1.png" alt="Pose frontal com as duas mãos apoiadas no rosto" class="pose-guide-stage__photo" data-pose-photo>
            <div class="pose-guide-silhouette" data-silhouette aria-hidden="true">
              <img src="../assets/img/pose-guide-contour-1.svg" alt="" class="pose-guide-silhouette__line" draggable="false" data-pose-contour>
            </div>
          </div>

          <div class="pose-guide-examples" role="group" aria-label="Escolher uma sugestão de pose">
            <button type="button" class="pose-guide-example is-active" data-pose-choice="0" aria-pressed="true" aria-label="Usar pose dinâmica">
              <span class="pose-guide-example__media">
                <img src="../assets/img/camera-thumb-1.png" alt="">
                <img src="../assets/img/pose-guide-contour-1.svg" alt="" aria-hidden="true">
              </span>
              <span>Dinâmica</span>
            </button>
            <button type="button" class="pose-guide-example" data-pose-choice="1" aria-pressed="false" aria-label="Usar pose clássica">
              <span class="pose-guide-example__media">
                <img src="../assets/img/camera-thumb-2.png" alt="">
                <img src="../assets/img/pose-guide-contour-2.svg" alt="" aria-hidden="true">
              </span>
              <span>Clássica</span>
            </button>
            <button type="button" class="pose-guide-example" data-pose-choice="2" aria-pressed="false" aria-label="Usar pose editorial">
              <span class="pose-guide-example__media">
                <img src="../assets/img/camera-thumb-3.png" alt="">
                <img src="../assets/img/pose-guide-contour-3.svg" alt="" aria-hidden="true">
              </span>
              <span>Editorial</span>
            </button>
          </div>

          <!-- Legenda de voz (caption) -->
          <p class="pose-guide-caption" data-voice-caption hidden>
            <span class="pose-guide-caption-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              </svg>
            </span>
            <span data-pose-tip-text>Centralize o rosto e aproxime as mãos das bochechas.</span>
          </p>

          <!-- Barra inferior -->
          <div class="camera-bottom">
            <!-- Faixa de modos: rótulos, ordem e destinos vêm de
                 assets/js/camera-modes.js (fonte única do protótipo). -->
            <div class="jovi-modes" data-camera-modes="gerais" data-modo-ativo="retrato"></div>

            <div class="camera-shutter-row">
              <button type="button" class="camera-side-btn" aria-label="Trocar pose" onclick="joviNavegar('tela-13-camera.html')">
                <img src="../assets/img/cam-gallery-icon.svg" alt="" style="width:24px;height:24px;">
              </button>
              <button type="button" class="camera-shutter" data-camera-shutter aria-label="Capturar foto" data-toast="Foto salva na galeria">
                <span class="camera-shutter-inner"></span>
              </button>
              <button type="button" class="camera-side-btn" aria-label="Alternar câmera" style="background:transparent;border:none;">
                <img src="../assets/img/cam-flip.svg" alt="" style="width:56px;height:56px;">
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/pose-guide.js"></script>
  <script>
    // Mostra a legenda de voz só se o toggle da tela 13 estiver ligado.
    (function () {
      var caption = document.querySelector('[data-voice-caption]');
      if (!caption) return;
      var isOn = sessionStorage.getItem('jovi-voice-guide') === 'on';
      caption.hidden = !isOn;
    })();
  </script>
  <script src="../assets/js/camera-modes.js"></script>
</body>
</html>
