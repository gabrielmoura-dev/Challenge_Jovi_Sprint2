<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Estudo</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/estudo-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-22.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame estudo-tela tela-22">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <header class="estudo-header">
        <div class="estudo-header-text">
          <h1 class="estudo-title">Estudo</h1>
          <p class="estudo-meta">Tudo que você fotografou vira jogo aqui</p>
        </div>
      </header>

      <div class="estudo-scroll">
        <section class="retomar-card">
          <img src="../assets/img/estudo-card-elipse.svg" alt="" class="retomar-elipse">
          <p class="retomar-kicker">CONTINUAR DE ONDE PAROU</p>
          <p class="retomar-titulo">Cálculo · Capítulo 5</p>
          <p class="retomar-meta">6 tópicos prontos · 24 perguntas suas</p>
          <button type="button" class="retomar-btn" onclick="joviNavegar('tela-25-estudo-roleta.html?album=calculo-5')">
            <img src="../assets/img/estudo-raio.svg" alt="">
            <span>Girar a roleta</span>
          </button>
        </section>

        <section class="albuns-secao">
          <h2 class="secao-label">Seus álbuns</h2>

          <button type="button" class="album-item" onclick="joviNavegar('tela-23-estudo-album.html?album=calculo-5')">
            <span class="album-capa">
              <img src="../assets/img/estudo-capa-calculo.png" alt="">
            </span>
            <span class="album-texto">
              <span class="album-titulo">Cálculo · Capítulo 5</span>
              <span class="album-meta">4 páginas · 6 tópicos · Hoje</span>
              <span class="estudo-coroas" aria-label="2 de 3 coroas">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
            </span>
            <img src="../assets/img/estudo-chevron-right.svg" alt="" class="album-chevron">
          </button>

          <button type="button" class="album-item" onclick="joviNavegar('tela-23-estudo-album.html?album=fisica-2')">
            <span class="album-capa">
              <img src="../assets/img/estudo-capa-fisica.png" alt="">
            </span>
            <span class="album-texto">
              <span class="album-titulo">Física · Capítulo 2</span>
              <span class="album-meta">2 páginas · 3 tópicos · Ontem</span>
              <span class="estudo-coroas" aria-label="0 de 3 coroas">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
            </span>
            <img src="../assets/img/estudo-chevron-right.svg" alt="" class="album-chevron">
          </button>

          <button type="button" class="album-novo" onclick="joviNavegar('tela-08-camera-estudo.html?intencao=album-novo')">
            <img src="../assets/img/estudo-camera-novo.svg" alt="">
            <span>Fotografar um caderno novo</span>
          </button>
        </section>

        <section class="como-funciona-card">
          <h2 class="secao-label">Como uma foto vira pergunta</h2>
          <div class="fluxo">
            <div class="fluxo-passo">
              <span class="fluxo-circulo"><img src="../assets/img/estudo-fluxo-foto.svg" alt=""></span>
              <span class="fluxo-texto">Você<br>fotografa</span>
            </div>
            <img src="../assets/img/estudo-fluxo-seta.svg" alt="" class="fluxo-seta">
            <div class="fluxo-passo">
              <span class="fluxo-circulo"><img src="../assets/img/estudo-fluxo-ia.svg" alt=""></span>
              <span class="fluxo-texto">O JOVI lê<br>e escreve</span>
            </div>
            <img src="../assets/img/estudo-fluxo-seta.svg" alt="" class="fluxo-seta">
            <div class="fluxo-passo">
              <span class="fluxo-circulo is-roxo"><img src="../assets/img/estudo-fluxo-roleta.svg" alt=""></span>
              <span class="fluxo-texto">A roleta<br>sorteia</span>
            </div>
          </div>
        </section>

        <section class="armazenamento">
          <img src="../assets/img/estudo-armazenamento.svg" alt="">
          <div class="armazenamento-texto">
            <p class="armazenamento-titulo">6 fotos guardadas · 4,2 MB</p>
            <p class="armazenamento-sub">No aparelho. Só você vê.</p>
          </div>
          <button type="button" class="armazenamento-link" data-toast="Gerenciamento de fotos em breve">Gerenciar</button>
        </section>
      </div>

      <nav class="lacar-nav-bottom" aria-label="Navegação principal">
        <button type="button" class="btn p-0 border-0" aria-label="Início" onclick="joviNavegar('tela-05-inicio.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </button>
        <button type="button" class="lacar-nav-fab" aria-label="Abrir câmera" onclick="joviNavegar('tela-13-camera.html')">
          <img src="../assets/img/nav-camera.svg" alt="">
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Diário" aria-current="page" onclick="joviNavegar('tela-11-assistente-estudo.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Ajustes" onclick="joviNavegar('tela-17-ajustes.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/toast.js"></script>

</html>
