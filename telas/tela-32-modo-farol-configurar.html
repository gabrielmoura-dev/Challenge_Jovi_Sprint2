<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Modo Farol (configurar)</title>

  <!--
    Nota: diferente das Telas 31 e 33 (tela bloqueada e alerta recebido, que
    são escuras), esta tela de configuração é CLARA no Figma (nó 553:1749) —
    ela é aberta a partir de Ajustes. Por isso segue o tema light/dark do
    projeto, e não a paleta --farol-* das outras duas.
  -->

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-31.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-32.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle style="left: 16px;">🌙 Dark</button>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-32">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <header class="farol-header">
        <button type="button" class="farol-back" aria-label="Voltar" onclick="window.location.href='tela-17-ajustes.html'">
          <img src="../assets/img/estudo-chevron-left.svg" alt="">
        </button>
        <h1 class="farol-titulo">Modo Farol</h1>
      </header>

      <div class="farol-scroll">
        <div class="farol-lista">
          <div class="farol-linha">
            <span class="farol-linha-ico">
              <img src="../assets/img/farol-sino.svg" alt="">
            </span>
            <span class="farol-linha-texto">
              <span class="farol-linha-titulo">Modo Farol ativo</span>
              <span class="farol-linha-sub">Alerta discreto para contatos</span>
            </span>
            <button type="button" class="farol-switch is-on" role="switch" aria-checked="true" aria-label="Ativar Modo Farol">
              <span class="farol-switch-bolinha"></span>
            </button>
          </div>
        </div>

        <section class="farol-secao">
          <h2 class="farol-secao-titulo">Gesto de ativação</h2>
          <p class="farol-secao-sub">Precisa funcionar com a tela travada, sem abrir o app.</p>

          <div class="farol-lista">
            <button type="button" class="gesto is-ativo" data-gesto aria-pressed="true">
              <span class="gesto-ico"><img src="../assets/img/farol-gesto-volume.svg" alt=""></span>
              <span class="gesto-texto">
                <span class="gesto-titulo">3× volume</span>
                <span class="gesto-sub">Aperte o volume três vezes</span>
              </span>
              <img src="../assets/img/farol-check.svg" alt="" class="gesto-marca">
            </button>
            <button type="button" class="gesto" data-gesto aria-pressed="false">
              <span class="gesto-ico"><img src="../assets/img/farol-gesto-power.svg" alt=""></span>
              <span class="gesto-texto">
                <span class="gesto-titulo">Volume + Ligar por 7s</span>
                <span class="gesto-sub">Segure os dois juntos</span>
              </span>
              <img src="../assets/img/farol-check.svg" alt="" class="gesto-marca">
            </button>
            <button type="button" class="gesto" data-gesto aria-pressed="false">
              <span class="gesto-ico"><img src="../assets/img/farol-gesto-toque.svg" alt=""></span>
              <span class="gesto-texto">
                <span class="gesto-titulo">Toque duplo nas costas</span>
                <span class="gesto-sub">Dois toques na traseira</span>
              </span>
              <img src="../assets/img/farol-check.svg" alt="" class="gesto-marca">
            </button>
            <button type="button" class="gesto" data-gesto aria-pressed="false">
              <span class="gesto-ico"><img src="../assets/img/farol-gesto-vibrar.svg" alt=""></span>
              <span class="gesto-texto">
                <span class="gesto-titulo">Chacoalhar 3×</span>
                <span class="gesto-sub">Sacuda, mesmo no bolso</span>
              </span>
              <img src="../assets/img/farol-check.svg" alt="" class="gesto-marca">
            </button>
          </div>
        </section>

        <section class="farol-secao">
          <h2 class="farol-secao-titulo">Quem recebe o alerta</h2>

          <div class="farol-lista">
            <div class="farol-linha">
              <span class="contato-avatar">MC</span>
              <span class="farol-linha-texto">
                <span class="farol-linha-titulo">Marina Costa</span>
                <span class="farol-linha-sub">irmã</span>
              </span>
              <button type="button" class="farol-switch is-on" role="switch" aria-checked="true" aria-label="Avisar Marina Costa">
                <span class="farol-switch-bolinha"></span>
              </button>
            </div>
            <div class="farol-linha">
              <span class="contato-avatar is-secundario">RT</span>
              <span class="farol-linha-texto">
                <span class="farol-linha-titulo">Rafael Teixeira</span>
                <span class="farol-linha-sub">amigo próximo</span>
              </span>
              <button type="button" class="farol-switch is-on" role="switch" aria-checked="true" aria-label="Avisar Rafael Teixeira">
                <span class="farol-switch-bolinha"></span>
              </button>
            </div>
          </div>
        </section>
      </div>

      <div class="farol-rodape">
        <button type="button" class="farol-btn" onclick="window.location.href='tela-31-modo-farol-ativacao.html'">Simular ativação</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/farol-simulacao.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
