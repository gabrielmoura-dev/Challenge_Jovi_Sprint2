<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Visualizador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/jullia-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-19.css">
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle style="left: 16px;">🌙 Dark</button>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="phone-shell">
    <main class="phone-frame p-0">
      <div class="viewer-frame">
        <img src="../assets/img/tela19-bg.png" alt="Vídeo da palestra" class="viewer-bg">

        <div class="viewer-content">
          <!-- Status bar -->
          <div class="jovi-statusbar viewer-statusbar">
            <span>17:32</span>
            <div class="d-flex align-items-center gap-1">
              <img src="../assets/img/status-signal.svg" alt="">
              <img src="../assets/img/status-wifi.svg" alt="">
              <img src="../assets/img/status-battery-body.svg" alt="" style="height:14px;">
            </div>
          </div>

          <!-- Barra superior -->
          <div class="viewer-topbar">
            <button type="button" class="viewer-icon-btn" aria-label="Fechar" onclick="window.location.href='tela-06-galeria.html'">
              <img src="../assets/img/t19-close.svg" alt="">
            </button>
            <button type="button" class="d-flex align-items-center gap-1 border-0 rounded-pill px-2 py-1"
                    style="background:var(--jovi-primary);" aria-label="Transcrição por voz">
              <img src="../assets/img/t19-mic.svg" alt="" style="width:20px;height:20px;filter:brightness(0) invert(1);">
              <span class="text-white fw-semibold" style="font-size:12px;">A文</span>
            </button>
            <button type="button" class="viewer-icon-btn" aria-label="Girar">
              <img src="../assets/img/t19-rotate.svg" alt="">
            </button>
          </div>

          <!-- Legenda + progresso -->
          <div class="viewer-caption-badge">
            Bem-vindos a todos à palestra de hoje
          </div>
          <div class="viewer-progress-badge">
            <img src="../assets/img/t19-play.svg" alt="Reproduzir" style="width:20px;height:20px;filter:brightness(0) invert(1);">
            00:01 / 00:23
          </div>

          <!-- Ações -->
          <div class="viewer-actions">
            <button type="button" class="btn p-0 border-0" aria-label="Curtir">
              <img src="../assets/img/t19-heart.svg" alt="">
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Editar">
              <img src="../assets/img/t19-pencil.svg" alt="">
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Compartilhar">
              <img src="../assets/img/t19-share.svg" alt="">
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Volume">
              <svg class="jovi-ico" style="color:#fff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Excluir">
              <img src="../assets/img/t19-trash.svg" alt="">
            </button>
          </div>

          <!-- Nav inferior -->
          <nav class="jovi-nav-bottom" style="background:var(--jovi-bg);" aria-label="Navegação principal">
            <button type="button" class="btn p-0 border-0" aria-label="Início">
              <svg class="jovi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Galeria" onclick="window.location.href='tela-06-galeria.html'">
              <svg class="jovi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <button type="button" class="jovi-nav-fab" aria-label="Abrir câmera" onclick="window.location.href='tela-13-camera.html'">
              <img src="../assets/img/nav-camera.svg" alt="">
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Diário">
              <svg class="jovi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
            </button>
            <button type="button" class="btn p-0 border-0" aria-label="Ajustes">
              <svg class="jovi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </nav>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
</body>
</html>
