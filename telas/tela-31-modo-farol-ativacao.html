<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Modo Farol (ativação)</title>

  <!--
    Nota: como as Telas 19/20/21, o Modo Farol não tem variante "light" no
    design — o tema fica fixo em dark. Esta é a simulação da tela bloqueada:
    nada aqui denuncia que um alerta está sendo preparado.
  -->

  <link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-31.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
</head>
<body>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-31">
      <!-- Destino fixo, e não joviVoltar(): quem chega aqui pela Tela 33
           (voltar do alerta) tinha essa tela no histórico, então o
           history.back() devolvia pro alerta e o par 31↔33 virava um laço
           sem saída. O caminho desta tela é sempre 32 → 31. -->
      <button type="button" class="jovi-back jovi-back--overlay" aria-label="Voltar" onclick="joviNavegar('tela-32-modo-farol-configurar.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="lacar-statusbar">
        <span>23:41</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="bloqueio-corpo">
        <div class="bloqueio-relogio">
          <p class="bloqueio-data">sábado, 29 de agosto</p>
          <p class="bloqueio-hora">23:41</p>
          <p class="bloqueio-bateria">72% de bateria</p>
        </div>

        <div class="bloqueio-card">
          <span class="bloqueio-ico">
            <img src="../assets/img/farol-volume.svg" alt="">
          </span>
          <p class="bloqueio-titulo">Nada aqui entrega o que vai acontecer</p>
          <p class="bloqueio-texto">Aperte o volume três vezes com a tela travada. Ninguém ao redor percebe.</p>
        </div>
      </div>

      <div class="bloqueio-rodape">
        <!-- Simulação: leva para a visão de quem recebe o alerta (Tela 33). -->
        <button type="button" class="farol-btn" data-simular-gesto data-destino="tela-33-modo-farol-alerta.html?simulacao=1">Simular 3× volume</button>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/farol-simulacao.js"></script>
</body>
</html>
