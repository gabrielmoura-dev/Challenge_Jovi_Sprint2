<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Álbum de estudo</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/estudo-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-23-estudo.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle style="left: 16px;">🌙 Dark</button>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame estudo-tela tela-23-estudo">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <header class="estudo-header">
        <button type="button" class="estudo-back" aria-label="Voltar" onclick="window.location.href='tela-22-estudo.html'">
          <img src="../assets/img/estudo-chevron-left.svg" alt="">
        </button>
        <div class="estudo-header-text">
          <h1 class="estudo-title">Cálculo · Capítulo 5</h1>
          <p class="estudo-meta">4 páginas · 6 tópicos · 24 perguntas</p>
        </div>
      </header>

      <div class="estudo-scroll">
        <section class="paginas-tira" aria-label="Páginas fotografadas">
          <button type="button" class="pagina-thumb" aria-label="Foto 1">
            <img src="../assets/img/estudo-pagina-1.png" alt="">
            <span class="pagina-num">1</span>
          </button>
          <button type="button" class="pagina-thumb" aria-label="Foto 2">
            <img src="../assets/img/estudo-pagina-2.png" alt="">
            <span class="pagina-num">2</span>
          </button>
          <button type="button" class="pagina-thumb" aria-label="Foto 3">
            <img src="../assets/img/estudo-pagina-3.png" alt="">
            <span class="pagina-num">3</span>
          </button>
          <button type="button" class="pagina-thumb" aria-label="Foto 4">
            <img src="../assets/img/estudo-pagina-4.png" alt="">
            <span class="pagina-num">4</span>
          </button>
          <button type="button" class="pagina-nova" onclick="window.location.href='tela-08-camera-estudo.html?intencao=nova-pagina&amp;album=calculo-5'">
            <img src="../assets/img/estudo-pagina-nova.svg" alt="">
            <span>Página</span>
          </button>
        </section>

        <section class="topicos-secao">
          <h2 class="topicos-label">Tópicos que saíram destas fotos</h2>
          <div class="topicos-lista">
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Limites</span>
                <span class="topico-meta">Foto 1 · 4 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="2 de 3 coroas">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Integrais definidas</span>
                <span class="topico-meta">Foto 1 · 5 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="3 de 3 coroas">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Teorema fundamental</span>
                <span class="topico-meta">Foto 2 · 4 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="1 de 3 coroas">
                <img src="../assets/img/estudo-coroa-cheia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Área sob a curva</span>
                <span class="topico-meta">Foto 2 · 4 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="0 de 3 coroas">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Substituição</span>
                <span class="topico-meta">Foto 3 · 4 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="0 de 3 coroas">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
            <button type="button" class="topico-linha" data-toast="Detalhe do tópico em breve">
              <span class="topico-texto">
                <span class="topico-titulo">Integração por partes</span>
                <span class="topico-meta">Foto 4 · 3 perguntas</span>
              </span>
              <span class="estudo-coroas" aria-label="0 de 3 coroas">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
                <img src="../assets/img/estudo-coroa-vazia.svg" alt="">
              </span>
              <img src="../assets/img/estudo-chevron-right-16.svg" alt="" class="topico-chevron">
            </button>
          </div>
        </section>

        <div class="estudo-dica">
          <img src="../assets/img/estudo-sparkle.svg" alt="">
          <p>As 24 perguntas foram escritas pelo JOVI a partir destas 4 fotos. Cada tópico guarda a página que o originou: apagou a foto, o tópico sai junto.</p>
        </div>
      </div>

      <div class="estudo-rodape">
        <button type="button" class="estudo-btn" onclick="window.location.href='tela-25-estudo-roleta.html?album=calculo-5'">Girar a roleta deste álbum</button>
        <button type="button" class="estudo-btn estudo-btn-secundario" onclick="window.location.href='tela-08-camera-estudo.html?intencao=nova-pagina&amp;album=calculo-5'">Fotografar mais uma página</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
