<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Seleção de fotos IA</title>
  <link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-10.css">
  <link rel="stylesheet" href="../assets/css/camera-shared.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-11.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
</head>
<body>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame camera-frame" data-node-id="159:4405" data-name="tela 11">
      <img src="../assets/img/camera-interface-bg.png" alt="" class="camera-bg" data-node-id="159:4406">

      <div class="lacar-statusbar camera-statusbar" data-node-id="159:4411">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="camera-topbar" data-node-id="159:4429">
        <button type="button" class="camera-settings-btn" aria-label="Voltar" onclick="joviVoltar('tela-08-camera-estudo.html', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="camera-chips">
          <button type="button" class="camera-chip chip-pose" aria-label="Pose">
            <span class="camera-chip-badge">
              <img src="../assets/img/cam-pose-badge.png" alt="">
              <span>POSE</span>
            </span>
          </button>
          <button type="button" class="camera-chip chip-guide" aria-label="Guia de leitura">
            <img src="../assets/img/book-open-text-purple.svg" alt="">
          </button>
          <button type="button" class="camera-chip chip-ai" aria-label="Melhorias IA">
            <img src="../assets/img/cam-sparkle.svg" alt="">
          </button>
          <button type="button" class="camera-chip chip-mp" aria-label="200 megapixels">
            <span class="camera-chip-badge">
              <img src="../assets/img/cam-mp-badge.png" alt="">
              <span>200 mp</span>
            </span>
          </button>
          <button type="button" class="camera-chip chip-flash" aria-label="Flash">
            <img src="../assets/img/cam-lightning.svg" alt="">
          </button>
        </div>
        <button type="button" class="camera-settings-btn" aria-label="Configurações" onclick="joviNavegar('tela-17-ajustes.html')">
          <img src="../assets/img/cam-settings.svg" alt="">
        </button>
      </div>

      <button type="button" class="camera-confirm-btn" aria-label="Confirmar seleção" data-node-id="159:4409" onclick="joviNavegar('tela-11-assistente-estudo.html')">
        <img src="../assets/img/icon-check.svg" alt="">
      </button>

      <div class="camera-spacer"></div>

      <div class="camera-filmstrip" data-node-id="159:4456">
        <button type="button" class="camera-filmstrip-item is-selected" data-node-id="159:4458" data-filmstrip-item aria-pressed="true" aria-label="Foto gerada por IA 1 — selecionada">
          <img src="../assets/img/ai-photo-filmstrip-1.png" alt="Foto gerada por IA 1">
          <span class="filmstrip-check" data-node-id="159:4407"><img src="../assets/img/icon-check.svg" alt=""></span>
        </button>
        <button type="button" class="camera-filmstrip-item is-selected" data-node-id="159:4459" data-filmstrip-item aria-pressed="true" aria-label="Foto gerada por IA 2 — selecionada">
          <img src="../assets/img/ai-photo-filmstrip-2.png" alt="Foto gerada por IA 2">
          <span class="filmstrip-check" data-node-id="159:4462"><img src="../assets/img/icon-check.svg" alt=""></span>
        </button>
        <button type="button" class="camera-filmstrip-item is-selected" data-node-id="159:4460" data-filmstrip-item aria-pressed="true" aria-label="Foto gerada por IA 3 — selecionada">
          <img src="../assets/img/ai-photo-filmstrip-3.png" alt="Foto gerada por IA 3">
          <span class="filmstrip-check" data-node-id="159:4464"><img src="../assets/img/icon-check.svg" alt=""></span>
        </button>
        <button type="button" class="camera-filmstrip-item" data-node-id="159:4461" data-filmstrip-item aria-pressed="false" aria-label="Foto gerada por IA 4 — não selecionada">
          <img src="../assets/img/ai-photo-filmstrip-4.png" alt="Foto gerada por IA 4">
          <span class="filmstrip-check"><img src="../assets/img/icon-check.svg" alt=""></span>
        </button>
      </div>

      <div class="camera-bottombar" data-camera-bar data-node-id="159:4466">
        <div class="camera-modes" data-camera-modes role="group" aria-label="Modo de captura">
          <button type="button" class="camera__mode" data-camera-mode="blindagem" aria-pressed="false">Blindagem</button>
          <button type="button" class="camera__mode is-active" data-camera-mode="estudo" aria-pressed="true">Estudo</button>
          <button type="button" class="camera__mode" data-camera-mode="esporte" aria-pressed="false">Esporte</button>
          <button type="button" class="camera__mode" data-camera-mode="foto" aria-pressed="false">Foto</button>
          <button type="button" class="camera__mode" data-camera-mode="retrato" aria-pressed="false">Retrato</button>
          <button type="button" class="camera__mode" data-camera-mode="video" aria-pressed="false">Vídeo</button>
        </div>
        <!-- Esta tela é a seleção de fotos do Chat (Estudo): as outras
             intenções levam de volta à câmera de estudo. -->
        <div class="camera-intents" data-study-intent data-study-intent-fixed="chat" role="group" aria-label="O que você vai capturar">
          <button type="button" class="is-active" data-intent="chat" aria-pressed="true">Chat</button>
          <button type="button" data-intent="palestra" aria-pressed="false">Palestra</button>
          <button type="button" data-intent="exercicio" aria-pressed="false">Exercício</button>
        </div>
        <p class="camera-intent-label" data-study-intent-label>Captura vai para o Chat com a IA</p>

        <div class="camera-shutter-row">
          <button type="button" class="shutter-side-btn" data-camera-side aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
            <img src="../assets/img/cam-gallery-icon.svg" alt="">
          </button>
          <button type="button" class="shutter-btn" aria-label="Enviar seleção para o Chat" data-camera-shutter data-toast="Fotos enviadas para o Chat">
            <span class="shutter-btn-inner"></span>
          </button>
          <button type="button" class="shutter-side-btn" data-camera-side aria-label="Alternar câmera">
            <img src="../assets/img/refresh-ccw.svg" alt="">
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/camera-modes.js"></script>
  <script>
    // Tela 9 — seleção das fotos que a IA escolheu: toca numa foto do
    // filmstrip pra incluir/excluir ela da seleção (a marca de check).
    (function () {
      document.querySelectorAll("[data-filmstrip-item]").forEach(function (item) {
        item.addEventListener("click", function () {
          var selected = item.classList.toggle("is-selected");
          item.setAttribute("aria-pressed", String(selected));
        });
      });
    })();
  </script>
</body>
</html>
