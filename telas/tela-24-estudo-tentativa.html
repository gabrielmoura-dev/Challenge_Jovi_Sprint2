<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Tentativa de exercício</title>

  <!--
    Nota: assim como as Telas 08 e 13, esta é câmera em fullscreen sobre a
    cena real (aqui, a folha do caderno com a resolução do exercício) — não
    existe variante "light" no design (nó 550:359), então o tema fica fixo
    em dark.
  -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-24-estudo.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-24-estudo">
      <!-- Foto do caderno enquadrada pela câmera (export do Figma). -->
      <img src="../assets/img/estudo-tentativa-foto.png" alt="" class="tentativa-foto">

      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="tentativa-topbar">
        <button type="button" class="tentativa-back" aria-label="Voltar" onclick="joviNavegar('tela-23-estudo-album.html')">
          <img src="../assets/img/farol-chevron-left.svg" alt="">
        </button>
        <span class="tentativa-pill">Tentativa 01</span>
      </div>

      <div class="tentativa-visor" aria-hidden="true">
        <span class="visor-canto canto-tl"></span>
        <span class="visor-canto canto-tr"></span>
        <span class="visor-canto canto-bl"></span>
        <span class="visor-canto canto-br"></span>
      </div>

      <div class="tentativa-painel">
        <p class="tentativa-titulo">O que você tentou até aqui?</p>
        <p class="tentativa-sub">Enquadre o exercício e sua resolução, mesmo incompleta.</p>

        <div class="tentativa-controles">
          <button type="button" class="tentativa-lateral is-galeria" aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
            <img src="../assets/img/estudo-cam-galeria.svg" alt="">
          </button>
          <button type="button" class="tentativa-obturador" aria-label="Capturar tentativa" onclick="joviNavegar('tela-23-estudo-album.html?tentativa=enviada')">
            <span></span>
          </button>
          <button type="button" class="tentativa-lateral is-inverter" aria-label="Alternar câmera">
            <img src="../assets/img/estudo-cam-inverter.svg" alt="">
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
