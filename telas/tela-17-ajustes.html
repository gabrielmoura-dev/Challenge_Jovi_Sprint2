<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Ajustes</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-21.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle style="left: 16px;">🌙 Dark</button>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-21">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <header class="settings-header">
        <button type="button" class="settings-back" aria-label="Voltar" onclick="joviNavegar('tela-05-inicio.html')">
          <img src="../assets/img/chevron-left.svg" alt="">
        </button>
        <h1 class="settings-title">Ajustes</h1>
      </header>

      <div class="settings-scroll">
        <section class="appearance-section">
          <h2 class="settings-section-title">Aparência</h2>
          <div class="appearance-grid">
            <button type="button" class="appearance-btn active" data-appearance-option="light" aria-pressed="true">
              <img src="../assets/img/sun.svg" alt="">
              <span>Claro</span>
            </button>
            <button type="button" class="appearance-btn" data-appearance-option="dark" aria-pressed="false">
              <img src="../assets/img/moon.svg" alt="">
              <span>Escuro</span>
            </button>
            <button type="button" class="appearance-btn" data-appearance-option="system" aria-pressed="false">
              <img src="../assets/img/smartphone.svg" alt="">
              <span>Sistema</span>
            </button>
          </div>
        </section>

        <section>
          <h2 class="settings-section-title">Preferências</h2>
          <button type="button" class="settings-row" onclick="try { localStorage.removeItem('jovi-user-name'); } catch (e) {} joviNavegar('tela-01-onboarding.html')">
            <div class="settings-row-icon">
              <img src="../assets/img/refresh-cw.svg" alt="">
            </div>
            <div>
              <p class="settings-row-title">Refazer Onboarding</p>
              <p class="settings-row-subtitle">Atualize suas preferências</p>
            </div>
          </button>
        </section>

        <section>
          <h2 class="settings-section-title">Segurança</h2>
          <button type="button" class="settings-row" onclick="joviNavegar('tela-34-modo-blindagem.html')">
            <div class="settings-row-icon">
              <img src="../assets/img/shield.svg" alt="">
            </div>
            <div>
              <p class="settings-row-title">Modo Blindagem</p>
              <p class="settings-row-subtitle">Verifique se uma cobrança é golpe</p>
            </div>
          </button>
          <button type="button" class="settings-row" onclick="joviNavegar('tela-32-modo-farol-configurar.html')">
            <div class="settings-row-icon">
              <img src="../assets/img/bell-ring.svg" alt="">
            </div>
            <div>
              <p class="settings-row-title">Modo Farol</p>
              <p class="settings-row-subtitle">Configure o alerta discreto para um contato de confiança</p>
            </div>
          </button>
        </section>

        <section>
          <h2 class="settings-section-title">Sobre</h2>
          <div class="about-card">
            <div class="about-row">
              <span class="about-label">Versão</span>
              <span class="about-value">1.0.0</span>
            </div>
            <div class="about-row">
              <span class="about-label">Jovi · OriginOS</span>
              <span class="about-value">6.0</span>
            </div>
            <div class="about-divider">
              <p class="about-caption">Câmera com IA integrada. Otimizada para V70 5G.</p>
            </div>
          </div>
        </section>

        <section>
          <h2 class="settings-section-title">Preferências</h2>
          <button type="button" class="settings-row">
            <div class="settings-row-icon icon-lg">
              <img src="../assets/img/trash.svg" alt="">
            </div>
            <div>
              <p class="settings-row-title">Lixeira</p>
              <p class="settings-row-subtitle">Recupere o que foi excluído</p>
            </div>
          </button>
        </section>
      </div>

      <nav class="lacar-nav-bottom" aria-label="Navegação principal">
        <button type="button" class="btn p-0 border-0" aria-label="Início" onclick="joviNavegar('tela-05-inicio.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </button>
        <button type="button" class="lacar-nav-fab" aria-label="Abrir câmera" onclick="joviNavegar('tela-13-camera.html')">
          <img src="../assets/img/nav-camera.svg" alt="">
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Diário" onclick="joviNavegar('tela-11-assistente-estudo.html')">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button type="button" class="btn p-0 border-0" aria-label="Ajustes" aria-current="page">
          <svg class="lacar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
