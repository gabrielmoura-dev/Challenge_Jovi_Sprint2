<!doctype html>

<head>
<meta charset="utf-8">

<title>Câmera · Estudo</title>

<!--
  Nota: a tela 17 no Figma só existe em versão "no escuro" (câmera em
  fullscreen sobre uma cena de estudo). Como não há variante light no
  design, o tema fica fixo em dark aqui, seguindo o mesmo critério já
  usado na tela 16.
-->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/tokens.css" rel="stylesheet">
<link href="../assets/css/larii/Larii-componentes.css" rel="stylesheet">
<link href="../assets/css/larii/tela15.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book-open-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7C12 5.93913 11.5786 4.92172 10.8284 4.17157C10.0783 3.42143 9.06087 3 8 3H2V18H9C9.79565 18 10.5587 18.3161 11.1213 18.8787C11.6839 19.4413 12 20.2044 12 21M12 7V21M12 7C12 5.93913 12.4214 4.92172 13.1716 4.17157C13.9217 3.42143 14.9391 3 16 3H22V18H15C14.2044 18 13.4413 18.3161 12.8787 18.8787C12.3161 19.4413 12 20.2044 12 21M6 8H8M6 12H8M16 8H18M16 12H18"/>
  </symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>

  </symbol>
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M13.3055 3.04842C13.5367 3.15725 13.6703 3.42583 13.6289 3.69868L12.6439 10.2H17.4546C17.6611 10.2 17.85 10.3284 17.9424 10.5317C18.0348 10.735 18.0149 10.9782 17.8908 11.16L11.3454 20.76C11.1946 20.9813 10.9257 21.0603 10.6945 20.9516C10.4633 20.8428 10.3297 20.5742 10.371 20.3013L11.3561 13.8H6.54545C6.33886 13.8 6.14999 13.6716 6.05759 13.4683C5.9652 13.2651 5.98513 13.0218 6.10909 12.84L12.6545 3.24005C12.8054 3.01875 13.0743 2.9396 13.3055 3.04842Z"/>

    <rect x="2" y="6" width="14" height="12" rx="2"/>

  <symbol id="i-refresh-ccw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/>

<div class="app-frame app-frame--camera">

  <img class="camera__preview" src="../assets/img/camera-bg-estudo.jpg"
       alt="Prévia da câmera apontada para um livro aberto sobre a grama, em uma cena de estudo ao ar livre">
  <div class="camera__veil camera__veil--top" aria-hidden="true"></div>
  <div class="camera__veil camera__veil--bottom glass" aria-hidden="true"></div>

  <div class="camera__ui">

    <div class="status-bar status-bar--on-media" aria-hidden="true">
      <span class="status-bar__time">17:32</span>
      <span class="status-bar__icons">
        <img src="../assets/img/status-signal.svg" alt="">
        <img src="../assets/img/status-wifi.svg" alt="">
        <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
      </span>
    </div>

    <div class="camera__toolbar">
      <div class="camera__tools">
        <button type="button" class="icon-button icon-button--36" aria-label="Guia de pose">
          <span class="camera__badge-pose" aria-hidden="true">POSE</span>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Modo leitura">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-book-open-text"/></svg>
        </button>
        <button type="button" class="icon-button icon-button--36 camera__tool--ai" aria-label="Realce com IA">
          <svg width="20" height="20" aria-hidden="true"><use href="#i-sparkles"/></svg>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Resolução: 200 megapixels">
          <span class="camera__badge-mp" aria-hidden="true">200 mp</span>
        </button>
        <button type="button" class="icon-button icon-button--36" aria-label="Flash">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-zap"/></svg>
        </button>
      </div>
      <button type="button" class="icon-button icon-button--40" aria-label="Configurações da câmera">
        <svg width="20" height="20" aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
    </div>

    <div class="camera__panel">

      <!-- Faixa de modos: rótulos, ordem e destinos vêm de
           assets/js/camera-modes.js (fonte única do protótipo). -->
      <div class="jovi-modes" data-camera-modes="estudo" data-modo-ativo="palestra"></div>

      <div class="camera__actions">
        <button type="button" class="camera__side-button glass" aria-label="Abrir galeria" onclick="joviNavegar('tela-06-galeria.html')">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-image"/></svg>
        </button>
        <button type="button" class="camera__shutter" aria-label="Tirar foto" data-camera-shutter></button>
        <button type="button" class="camera__side-button glass" aria-label="Alternar câmera">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-refresh-ccw"/></svg>
        </button>
      </div>

    </div>

  </div>
</div>

<script src="../assets/js/jovi.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/tela15.js"></script>
<script>
  // Igual à câmera geral (tela-13): não existe tela de revisão de foto pra
  // esse fluxo — o clique já dispara o flash do obturador (jovi.js); só
  // falta a confirmação.
  (function () {
    var shutter = document.querySelector("[data-camera-shutter]");
    if (!shutter) return;
    shutter.addEventListener("click", function () {
      if (window.JoviToast) window.JoviToast.show("Foto salva na galeria");
    });
  })();
</script>
  <script src="../assets/js/camera-modes.js"></script>
</body>
</html>
