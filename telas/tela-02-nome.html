<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOVI Vision — Onboarding — Digite seu nome</title>

  <!-- Igual à Tela 01: paleta própria (tudo sobre a foto), sem variante
       clara/escura — mas mantém a preferência global viva pra quando o
       fluxo chegar nas telas seguintes. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>

  <!--
    ATENÇÃO — FONTE PROVISÓRIA
    O design original (Figma) usa a fonte customizada "JOVI_Sans_CN" (Regular/Bold),
    mas os arquivos da fonte não estão disponíveis no arquivo Figma.
    Estamos usando "Inter" (Google Fonts) como fallback temporário.
    TODO: trocar por JOVI_Sans_CN assim que os arquivos (.woff2) forem fornecidos.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-02.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
  <main class="onboarding-wrapper">
    <div class="onboarding-screen" data-node-id="109:634" data-name="Tela 2">

      <img src="../assets/img/onboarding-bg-tela02.png" alt="" class="onboarding-bg" data-node-id="109:635">
      <div class="onboarding-gradient" data-node-id="109:636"></div>

      <!-- Status bar -->
      <div class="status-bar d-flex justify-content-between align-items-center" data-node-id="150:4224">
        <span class="status-time">17:32</span>
        <div class="status-icons d-flex align-items-center gap-2">
          <img src="../assets/img/status-signal.svg" alt="" class="status-icon">
          <img src="../assets/img/status-wifi.svg" alt="" class="status-icon">
          <img src="../assets/img/status-battery.svg" alt="" class="status-icon status-icon--battery">
        </div>
      </div>

      <!-- TODO: substituir por logo oficial JOVI_Sans_CN quando os arquivos de fonte chegarem -->
      <h1 class="onboarding-heading tela02-heading" data-node-id="109:637" data-name="Heading 1">JOVI</h1>

      <input
        type="text"
        class="onboarding-input"
        placeholder="Digite seu nome"
        data-node-id="109:648"
        data-name="Text Input"
        data-onboarding-name
        autocomplete="off"
      >

      <button type="button" class="btn btn-onboarding-primary" data-node-id="109:640" data-onboarding-start data-next="tela-03-preferencias.html">Começar</button>
      <button type="button" class="btn btn-onboarding-secondary btn-onboarding-secondary--bordered" data-node-id="109:642" data-onboarding-skip data-next="tela-05-inicio.html">Pular</button>

      <div class="onboarding-dots d-flex align-items-center justify-content-center gap-2" data-node-id="150:4262">
        <span class="dot"></span>
        <span class="dot dot-active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
