<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Modo Blindagem</title>

  <!--
    Nota: como a Tela 18, o Modo Blindagem é câmera em fullscreen sobre a cena
    real (aqui, um boleto sendo escaneado) — não existe variante "light" no
    design (nó 553:1846), então o tema fica fixo em dark. A estrutura é a
    mesma da Tela 24, por isso ela carrega tela-24-estudo.css.

    O resultado exibido é de demonstração: os veredictos são pré-definidos por
    alvo em tela34.js, não há verificação real de fraude. "Nenhum risco
    encontrado" não é garantia de que uma cobrança real seja segura.
  -->

  <link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-24-estudo.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-34.css">
  <link rel="stylesheet" href="../assets/css/camera-shared.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
</head>
<body>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-24-estudo tela-34">
      <!-- Cena do documento enquadrado (export do Figma). -->
      <img src="../assets/img/blindagem-boleto-cena.png" alt="" class="blindagem-cena" data-blindagem-cena>

      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="tentativa-topbar">
        <button type="button" class="tentativa-back" aria-label="Voltar" onclick="joviNavegar('tela-17-ajustes.html')">
          <img src="../assets/img/farol-chevron-left.svg" alt="">
        </button>
        <span class="blindagem-badge">
          <img src="../assets/img/blindagem-escudo-badge.svg" alt="">
          <span>Modo Blindagem</span>
        </span>
        <button type="button" class="blindagem-config" aria-label="Configurações" data-toast="Configurações da Blindagem em breve">
          <img src="../assets/img/blindagem-config.svg" alt="">
        </button>
      </div>

      <div class="blindagem-visor" aria-hidden="true">
        <span class="blindagem-canto canto-tl"></span>
        <span class="blindagem-canto canto-tr"></span>
        <span class="blindagem-canto canto-bl"></span>
        <span class="blindagem-canto canto-br"></span>
      </div>

      <!-- Resultado da verificação. O estado desenhado no Figma é o de
           "sem risco"; .is-risco aplica a variante de alerta. -->
      <div class="blindagem-veredito" data-veredito>
        <span class="veredito-ico">
          <img src="../assets/img/blindagem-escudo-veredito.svg" alt="">
        </span>
        <div class="veredito-texto">
          <p class="veredito-titulo" data-veredito-titulo>Nenhum risco encontrado</p>
          <p class="veredito-sub" data-veredito-sub>Sem sinais de golpe neste boleto. Confira o valor antes de pagar.</p>
        </div>
      </div>

      <div class="tentativa-painel blindagem-painel" data-camera-bar>
        <!-- Faixa global de modos (Blindagem é um modo da câmera). -->
        <div class="blindagem-modos" data-camera-modes role="group" aria-label="Modo de captura">
          <button type="button" class="camera__mode is-active" data-camera-mode="blindagem" aria-pressed="true">Blindagem</button>
          <button type="button" class="camera__mode" data-camera-mode="estudo" aria-pressed="false">Estudo</button>
          <button type="button" class="camera__mode" data-camera-mode="esporte" aria-pressed="false">Esporte</button>
          <button type="button" class="camera__mode" data-camera-mode="foto" aria-pressed="false">Foto</button>
          <button type="button" class="camera__mode" data-camera-mode="retrato" aria-pressed="false">Retrato</button>
          <button type="button" class="camera__mode" data-camera-mode="video" aria-pressed="false">Vídeo</button>
        </div>
        <!-- O que verificar (contexto interno da Blindagem). -->
        <div class="blindagem-abas" role="tablist" aria-label="O que verificar">
          <button type="button" class="blindagem-aba is-ativa" role="tab" aria-selected="true" data-alvo="boleto">Boleto</button>
          <button type="button" class="blindagem-aba" role="tab" aria-selected="false" data-alvo="pix">Pix</button>
          <button type="button" class="blindagem-aba" role="tab" aria-selected="false" data-alvo="anuncio">Anúncio</button>
          <button type="button" class="blindagem-aba" role="tab" aria-selected="false" data-alvo="qrcode">QR Code</button>
        </div>

        <div class="tentativa-controles">
          <button type="button" class="tentativa-lateral is-galeria" data-camera-side aria-label="Galeria" onclick="joviNavegar('tela-06-galeria.html')">
            <img src="../assets/img/estudo-cam-galeria.svg" alt="">
          </button>
          <button type="button" class="tentativa-obturador" aria-label="Verificar novamente" data-blindagem-escanear>
            <span></span>
          </button>
          <button type="button" class="tentativa-lateral is-inverter" data-camera-side aria-label="Alternar câmera">
            <img src="../assets/img/estudo-cam-inverter.svg" alt="">
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/camera-modes.js"></script>
  <script src="../assets/js/tela34.js"></script>
</body>
</html>
