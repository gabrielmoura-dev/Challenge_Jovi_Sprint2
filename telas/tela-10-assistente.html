<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente IA</title>

<!-- Aplica o tema antes da primeira pintura para não piscar. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    if (saved !== "light" && saved !== "dark") {
      saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-bs-theme", saved);
  })();
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/tokens.css" rel="stylesheet">
<link href="../assets/css/larii/Larii-componentes.css" rel="stylesheet">
<link href="../assets/css/larii/tela12.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
    <path d="m21.854 2.147-10.94 10.939"/>
  </symbol>
</svg>

<div class="app-frame app-frame--assistant">

  <div class="status-bar" aria-hidden="true">
    <span class="status-bar__time">17:32</span>
      <span class="status-bar__icons">
        <img src="../assets/img/status-signal.svg" alt="">
        <img src="../assets/img/status-wifi.svg" alt="">
        <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
      </span>
  </div>

  <header class="app-header app-header--panel">
    <div class="app-header__left">
      <span class="avatar-brand" aria-hidden="true">
        <svg width="16" height="16"><use href="#i-sparkles"/></svg>
      </span>
      <h1 class="app-header__title t-heading-panel">Assistente IA</h1>
    </div>
    <button type="button" class="icon-button icon-button--36" aria-label="Fechar assistente" onclick="joviNavegar('tela-05-inicio.html')">
      <svg width="20" height="20" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </header>

  <main class="assistant">

    <div class="assistant__thumbs">
      <button type="button" class="photo-tile">
        <img src="../assets/img/assistente-foto-1.png" alt="Página de caderno com anotações de estudo">
      </button>
      <button type="button" class="photo-tile">
        <img src="../assets/img/assistente-foto-2.png" alt="Folha manuscrita sobre uma mesa">
      </button>
    </div>

    <div class="chat-bubble assistant__message">
      <p class="t-message">Olá! Sou seu assistente de estudos. Tem alguma dúvida sobre o conteúdo que você está fotografando?</p>
    </div>

  </main>

  <form class="composer">
    <div class="composer__row">
      <label class="visually-hidden" for="pergunta">Sua dúvida</label>
      <input class="composer__input t-body-sm" id="pergunta" type="text"
             placeholder="Digite sua dúvida..." autocomplete="off">
      <button type="submit" class="composer__send" aria-label="Enviar" data-composer-send>
        <svg width="18" height="18" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </div>
  </form>

</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/tela12.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
