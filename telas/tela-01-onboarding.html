<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOVI — Comece por aqui</title>

<!-- Aplica o tema antes da primeira pintura para não piscar. Esta tela tem
     paleta própria (é toda sobre a foto), mas mantém a preferência salva
     para as telas seguintes. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    if (saved !== "light" && saved !== "dark") {
      saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-bs-theme", saved);
  })();
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/larii/tokens.css" rel="stylesheet">
<link href="../assets/css/larii/Larii-componentes.css" rel="stylesheet">
<link href="../assets/css/larii/tela1.css" rel="stylesheet">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/>
  </symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/>
  </symbol>
  <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><path d="M22 11v2"/>
  </symbol>
</svg>

<div class="app-frame app-frame--onboarding">

  <img class="onboarding__bg" src="../assets/img/onboarding-hero.png"
       alt="Mulher de óculos escuros em frente a letreiros de neon">
  <div class="onboarding__scrim" aria-hidden="true"></div>

  <div class="onboarding__content">

    <div class="status-bar status-bar--on-media" aria-hidden="true">
      <span class="status-bar__time">17:32</span>
      <span class="status-bar__icons">
        <svg width="16" height="16"><use href="#i-signal"/></svg>
        <svg width="16" height="16"><use href="#i-wifi"/></svg>
        <svg width="20" height="20"><use href="#i-battery"/></svg>
      </span>
    </div>

    <h1 class="onboarding__mark"><span>JOVI</span></h1>

    <div class="onboarding__actions">
      <p class="onboarding__tagline t-tagline">Inteligência artificial para<br>suas fotos perfeitas</p>

      <button type="button" class="btn-block btn-block--inverse t-button-bold">Começar</button>
      <button type="button" class="btn-block btn-block--ghost t-button-bold">Pular</button>

      <div class="dots onboarding__dots" role="group" aria-label="Passo 1 de 4">
        <span class="dots__item is-active"></span>
        <span class="dots__item"></span>
        <span class="dots__item"></span>
        <span class="dots__item"></span>
      </div>
    </div>

  </div>
</div>

<script src="../assets/js/theme.js"></script>
</body>
</html>
