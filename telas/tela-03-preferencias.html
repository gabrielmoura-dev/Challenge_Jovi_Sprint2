  <!-- Aplica o tema antes da primeira pintura para não piscar (mesmo padrão
       das demais telas — ver assets/js/theme.js). -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>

  <!--

    O design original (Figma) usa a fonte customizada "JOVI_Sans_CN" (Regular/Bold/Demibold/Medium),
    mas os arquivos da fonte não estão disponíveis no arquivo Figma.
    Estamos usando "Inter" (Google Fonts) como fallback temporário.
    TODO: trocar por JOVI_Sans_CN assim que os arquivos (.woff2) forem fornecidos.
  -->
