<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Câmera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/jullia-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-16.css">
</head>
<body>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>
  <!--
    Nota: a tela 16 no Figma só existe em versão "no escuro" (câmera em
    fullscreen sobre foto). Não faz sentido um modo "light" aqui — o
    fundo é a própria foto/vídeo capturado, então omiti o toggle de tema
    nesta tela (mantê-lo criaria uma opção que não corresponde a nada
    no design real).
  -->

  <div class="phone-shell">
    <main class="phone-frame p-0">
      <div class="camera-frame">
        <img src="../assets/img/camera-bg.png" alt="Pré-visualização da câmera" class="camera-bg">

        <div class="camera-content">
          <!-- Status bar -->
          <div class="jovi-statusbar" style="background:rgba(10,10,10,0.4);">
            <span>17:32</span>
            <div class="d-flex align-items-center gap-1">
              <img src="../assets/img/status-signal.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-wifi.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-battery-body.svg" alt="" style="height:14px;filter:brightness(0) invert(1);">
            </div>
          </div>

          <!-- Barra de ferramentas superior -->
          <div class="camera-topbar">
            <div class="d-flex align-items-center gap-2">
              <button type="button" class="camera-chip" aria-label="Modo pose">
                <img src="../assets/img/cam-pose-badge.png" alt="">
                <span style="color:#a275b7;">POSE</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Guia">
                <img src="../assets/img/cam-book.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Melhorias IA">
                <img src="../assets/img/cam-sparkle.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Resolução 200 megapixels">
                <img src="../assets/img/cam-mp-badge.png" alt="">
                <span>200 mp</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Flash">
                <img src="../assets/img/cam-lightning.svg" alt="">
              </button>
            </div>
            <button type="button" class="camera-chip" aria-label="Configurações">
              <img src="../assets/img/cam-settings.svg" alt="">
            </button>
          </div>

          <!-- Miniaturas de estilo -->
          <div class="camera-thumbs">
            <img src="../assets/img/camera-thumb-1.png" alt="Estilo 1">
            <img src="../assets/img/camera-thumb-2.png" alt="Estilo 2">
            <img src="../assets/img/camera-thumb-3.png" alt="Estilo 3">
            <img src="../assets/img/camera-thumb-4.png" alt="Estilo 4">
          </div>

          <!-- Barra inferior -->
          <div class="camera-bottom">
            <div class="d-flex gap-2 overflow-auto mb-3" role="tablist" aria-label="Modo de captura">
              <button type="button" class="camera-mode-pill active" data-camera-mode>
                <img src="../assets/img/cam-mode-sport.svg" alt="" style="width:16px;height:16px;">
                Esporte
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-photo.svg" alt="" style="width:16px;height:16px;">
                Foto
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-portrait.svg" alt="" style="width:16px;height:16px;">
                Retrato
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-night.svg" alt="" style="width:16px;height:16px;">
                Noturno
              </button>
            </div>

            <div class="camera-shutter-row">
              <button type="button" class="camera-side-btn" aria-label="Abrir galeria" onclick="window.location.href='tela-06-galeria.html'">
                <img src="../assets/img/cam-gallery-icon.svg" alt="" style="width:24px;height:24px;">
              </button>
              <button type="button" class="camera-shutter" data-camera-shutter aria-label="Capturar foto" onclick="window.location.href='tela-19-visualizador-midia.html'">
                <span class="camera-shutter-inner"></span>
              </button>
              <button type="button" class="camera-side-btn" aria-label="Alternar câmera" style="background:transparent;border:none;">
                <img src="../assets/img/cam-flip.svg" alt="" style="width:56px;height:56px;">
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
</body>
</html>
