<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria</title>

<!-- Aplica o tema antes da primeira pintura para não piscar. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    if (saved !== "light" && saved !== "dark") {
      saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-bs-theme", saved);
  })();
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/larii/tokens.css" rel="stylesheet">
<link href="../assets/css/larii/Larii-componentes.css" rel="stylesheet">
<link href="../assets/css/larii/tela7.css" rel="stylesheet">
</head>
<body>

<!-- Biblioteca de ícones (Lucide, o mesmo conjunto usado no Figma).
     Herdam a cor do elemento pai via currentColor, então acompanham o tema. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-base" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>
  <symbol id="i-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/>
  </symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/>
  </symbol>
  <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><path d="M22 11v2"/>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15 18-6-6 6-6"/>
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 0L5 15c-1.5-1.5-3-3.2-3-5.5"/>
  </symbol>
  <symbol id="i-heart-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 0L5 15c-1.5-1.5-3-3.2-3-5.5"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/>
  </symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/><path d="M12 5v14"/>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
  </symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>
  </symbol>
  <symbol id="i-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5"/>
  </symbol>
</svg>

<div class="app-frame">

  <div class="gallery-top">

    <!-- Status bar do mock -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">17:32</span>
      <span class="status-bar__icons">
        <svg width="16" height="16"><use href="#i-signal"/></svg>
        <svg width="16" height="16"><use href="#i-wifi"/></svg>
        <svg width="20" height="20"><use href="#i-battery"/></svg>
      </span>
    </div>

    <header class="app-header">
      <div class="app-header__left">
        <button type="button" class="icon-button icon-button--32" aria-label="Voltar">
          <svg width="24" height="24" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <h1 class="app-header__title t-heading-md">Galeria</h1>
      </div>
      <button type="button" class="icon-button icon-button--40 icon-button--brand" aria-label="Favoritos">
        <svg width="20" height="20" aria-hidden="true"><use href="#i-heart-filled"/></svg>
      </button>
    </header>

    <div class="chip-row" data-chips role="group" aria-label="Filtrar por categoria">
      <button type="button" class="chip t-chip is-active" aria-pressed="true">Tudo</button>
      <button type="button" class="chip t-chip" aria-pressed="false">Vídeos</button>
      <button type="button" class="chip t-chip" aria-pressed="false">Esporte</button>
      <button type="button" class="chip t-chip" aria-pressed="false">Estudos</button>
      <button type="button" class="chip t-chip" aria-pressed="false">Palestras</button>
    </div>

    <form class="search-bar" role="search" onsubmit="return false">
      <svg class="search-bar__icon" width="20" height="20" aria-hidden="true"><use href="#i-search"/></svg>
      <svg class="search-bar__icon search-bar__icon--ai" width="20" height="20" aria-hidden="true"><use href="#i-sparkles"/></svg>
      <label class="visually-hidden" for="busca">Buscar na galeria</label>
      <input class="search-bar__input t-body-sm" id="busca" type="search" placeholder="Buscar fotos, pessoas, lugares...">
    </form>

  </div>

  <main class="gallery">

    <button type="button" class="btn-block btn-block--brand t-button gallery__cta" data-open-sheet>
      <svg width="20" height="20" aria-hidden="true"><use href="#i-plus"/></svg>
      Criar álbum
    </button>

    <section class="gallery__section gallery__section--hero" aria-labelledby="sec-vibe-canina">
      <h2 class="gallery__heading t-heading-section" id="sec-vibe-canina">Vibe Canina</h2>
      <button type="button" class="photo-card">
        <img class="photo-card__media" src="../assets/img/hero-cachorro.png" alt="Cachorro de pelo claro sentado sobre fundo verde">
        <span class="photo-card__body">
          <span class="photo-card__title t-body-md d-block">Vibes folhas</span>
          <span class="photo-card__meta t-meta">
            <span class="photo-card__meta-item">
              <svg width="14" height="14" aria-hidden="true"><use href="#i-calendar"/></svg>
              16 de abr. de 2024 - 17h30, ter.
            </span>
            <svg width="14" height="14" aria-hidden="true"><use href="#i-heart"/></svg>
          </span>
        </span>
      </button>
    </section>

    <section class="gallery__section gallery__section--albums" aria-labelledby="sec-albuns">
      <h2 class="gallery__heading t-heading-section" id="sec-albuns">Álbuns</h2>
      <div class="album-row">
        <button type="button" class="photo-tile"><img src="../assets/img/album-1.png" alt="Mulher entre folhagens em uma floresta"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/album-2.png" alt="Pessoa segurando uma folha em frente ao rosto"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/album-3.png" alt="Mulher sentada em um tronco na mata"></button>
      </div>
    </section>

    <section class="gallery__section gallery__section--month" aria-labelledby="sec-maio">
      <div class="gallery__heading-row">
        <h2 class="gallery__heading t-heading-sm" id="sec-maio">mai. de 2024</h2>
        <span class="gallery__count t-body-sm">9 fotos</span>
      </div>
      <div class="photo-grid">
        <button type="button" class="photo-tile"><img src="../assets/img/grid-1.png" alt="Silhuetas ao pôr do sol"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-2.png" alt="Homem caminhando por uma trilha na floresta"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-3.png" alt="Homem sentado ao pé de uma árvore"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-4.png" alt="Pessoa com uma folha diante do rosto à beira do rio"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-5.png" alt="Mulher sentada em um tronco caído"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-6.png" alt="Pessoa de boné vista de costas em campo aberto"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-7.png" alt="Pessoa sentada em um tronco à beira do lago"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-8.png" alt="Homem em pé entre árvores altas"></button>
        <button type="button" class="photo-tile"><img src="../assets/img/grid-9.png" alt="Mulher de saia longa em um gramado ao entardecer"></button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <button type="button" class="bottom-nav__item is-active" aria-label="Início" aria-current="page">
      <svg width="20" height="20" aria-hidden="true"><use href="#i-home"/></svg>
    </button>
    <button type="button" class="bottom-nav__item" aria-label="Galeria">
      <svg width="20" height="20" aria-hidden="true"><use href="#i-image"/></svg>
    </button>
    <button type="button" class="bottom-nav__fab" aria-label="Nova foto">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-camera"/></svg>
    </button>
    <button type="button" class="bottom-nav__item" aria-label="Álbuns">
      <svg width="20" height="20" aria-hidden="true"><use href="#i-book-open"/></svg>
    </button>
    <button type="button" class="bottom-nav__item" aria-label="Perfil">
      <svg width="20" height="20" aria-hidden="true"><use href="#i-user"/></svg>
    </button>
  </nav>

</div>

<!-- Bottom sheet "Criar álbum" -->
<div class="modal fade sheet" id="sheet-criar-album" tabindex="-1" aria-labelledby="sheet-titulo" aria-hidden="true"
     data-bs-backdrop="true">
  <div class="modal-dialog">
    <form class="modal-content">
      <div class="sheet__header">
        <h2 class="sheet__title t-heading-lg" id="sheet-titulo">Criar álbum</h2>
        <button type="button" class="icon-button icon-button--32" data-bs-dismiss="modal" aria-label="Fechar">
          <svg width="20" height="20" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="sheet__field">
        <label class="sheet__label t-body-sm" for="album-nome">Nome do álbum</label>
        <input class="sheet__input t-body-md" id="album-nome" type="text" placeholder="Ex: Viagem 2024" autocomplete="off">
      </div>

      <div class="sheet__actions">
        <button type="button" class="btn-sheet btn-sheet--neutral t-button" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn-sheet btn-sheet--brand t-button" data-sheet-submit disabled>
          <svg width="20" height="20" aria-hidden="true"><use href="#i-check"/></svg>
          Criar
        </button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/tela7.js"></script>
</body>
</html>
