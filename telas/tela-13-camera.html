<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Câmera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/jullia-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-16.css">
</head>
<body>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>
  <!--
    Nota: a tela 16 no Figma só existe em versão "no escuro" (câmera em
    fullscreen sobre foto). Não faz sentido um modo "light" aqui — o
    fundo é a própria foto/vídeo capturado, então omiti o toggle de tema
    nesta tela (mantê-lo criaria uma opção que não corresponde a nada
    no design real).
  -->

  <div class="phone-shell">
    <main class="phone-frame p-0">
      <div class="camera-frame" data-node-id="561:2216">
        <img src="../assets/img/camera-bg.png" alt="Pré-visualização da câmera" class="camera-bg" data-node-id="561:2217">
        <div class="camera-scrim" data-node-id="561:2218"></div>
        <div class="camera-pose-outline" data-node-id="561:2219" data-name="Contorno da pose (traçado na foto)">
          <img src="../assets/img/cam-pose-outline.svg" alt="">
        </div>

        <div class="camera-content">
          <!-- Status bar -->
          <div class="jovi-statusbar" style="background:rgba(10,10,10,0.4);" data-node-id="561:2262">
            <span>17:32</span>
            <div class="d-flex align-items-center gap-1">
              <img src="../assets/img/status-signal.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-wifi.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-battery-body.svg" alt="" style="height:14px;filter:brightness(0) invert(1);">
            </div>
          </div>

          <!-- Barra de ferramentas superior -->
          <div class="camera-topbar" data-node-id="561:2234">
            <div class="d-flex align-items-center gap-2">
              <button type="button" class="camera-chip" aria-label="Modo pose">
                <img src="../assets/img/cam-pose-badge.png" alt="">
                <span style="color:#a275b7;">POSE</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Guia">
                <img src="../assets/img/cam-book.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Melhorias IA">
                <img src="../assets/img/cam-sparkle.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Resolução 200 megapixels">
                <img src="../assets/img/cam-mp-badge.png" alt="">
                <span>200 mp</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Flash">
                <img src="../assets/img/cam-lightning.svg" alt="">
              </button>
            </div>
            <button type="button" class="camera-chip" aria-label="Configurações">
              <img src="../assets/img/cam-settings.svg" alt="">
            </button>
          </div>

          <!-- Instrução de enquadramento -->
          <div class="camera-instruction" data-node-id="561:2223" data-name="Container (instrução)">
            <div class="camera-instruction__row" data-node-id="561:2224">
              <p class="camera-instruction__step" data-node-id="561:2225">
                <span class="camera-instruction__step-current" data-node-id="561:2226">01</span>
                <span class="camera-instruction__step-total" data-node-id="561:2227">/ 05</span>
              </p>
              <div class="camera-align-badge" data-node-id="561:2228" data-name="Status (alinhamento)">
                <img src="../assets/img/cam-pose-check.svg" alt="" data-node-id="561:2229">
                <span data-node-id="561:2231">Pose alinhada</span>
              </div>
            </div>
            <p class="camera-instruction__title" data-node-id="561:2232">Olhe para a câmera</p>
            <p class="camera-instruction__subtitle" data-node-id="561:2233">Incline levemente a cabeça para o lado.</p>
          </div>

          <!-- Barra inferior -->
          <div class="camera-bottom">
            <div class="camera-pose-carousel" data-node-id="561:2282" data-name="Carrossel de poses">
              <div class="camera-pose-thumb active" data-node-id="561:2283" data-name="Pose 01 (atual)">
                <img src="../assets/img/camera-bg.png" alt="Pose 1 (atual)">
                <span class="camera-pose-thumb__label" data-node-id="561:2284">01</span>
              </div>
              <div class="camera-pose-thumb" data-node-id="561:2285" data-name="Pose 02">
                <img src="../assets/img/camera-pose-thumb-02.png" alt="Pose 2">
                <span class="camera-pose-thumb__label" data-node-id="561:2286">02</span>
              </div>
              <div class="camera-pose-thumb" data-node-id="561:2287" data-name="Pose 03">
                <img src="../assets/img/camera-pose-thumb-03.png" alt="Pose 3">
                <span class="camera-pose-thumb__label" data-node-id="561:2288">03</span>
              </div>
              <div class="camera-pose-thumb" data-node-id="561:2289" data-name="Pose 04">
                <img src="../assets/img/camera-pose-thumb-04.png" alt="Pose 4">
                <span class="camera-pose-thumb__label" data-node-id="561:2290">04</span>
              </div>
              <div class="camera-pose-thumb" data-node-id="561:2291" data-name="Pose 05">
                <img src="../assets/img/camera-pose-thumb-05.png" alt="Pose 5">
                <span class="camera-pose-thumb__label" data-node-id="561:2292">05</span>
              </div>
            </div>
            <div class="d-flex gap-2 overflow-auto mb-3 mt-3 camera-mode-scroll" role="tablist" aria-label="Modo de captura">
              <button type="button" class="camera-mode-pill active" data-camera-mode>
                <img src="../assets/img/cam-mode-sport.svg" alt="" style="width:16px;height:16px;">
                Esporte
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-photo.svg" alt="" style="width:16px;height:16px;">
                Foto
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-portrait.svg" alt="" style="width:16px;height:16px;">
                Retrato
              </button>
              <button type="button" class="camera-mode-pill" data-camera-mode>
                <img src="../assets/img/cam-mode-night.svg" alt="" style="width:16px;height:16px;">
                Noturno
              </button>
            </div>

            <div class="camera-shutter-row">
              <button type="button" class="camera-side-btn" aria-label="Abrir galeria" onclick="window.location.href='tela-06-galeria.html'">
                <img src="../assets/img/cam-gallery-icon.svg" alt="" style="width:24px;height:24px;">
              </button>
              <button type="button" class="camera-shutter" data-camera-shutter aria-label="Capturar foto">
                <span class="camera-shutter-inner"></span>
              </button>
              <button type="button" class="camera-side-btn" aria-label="Alternar câmera" style="background:transparent;border:none;">
                <img src="../assets/img/cam-flip.svg" alt="" style="width:56px;height:56px;">
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script>
    // Câmera geral: não existe tela de revisão de foto pra esse fluxo (a
    // tela-15 é o visualizador de PALESTRA, conteúdo diferente) — o clique
    // já dispara o flash do obturador (jovi.js); só falta a confirmação.
    (function () {
      var shutter = document.querySelector("[data-camera-shutter]");
      if (!shutter) return;
      shutter.addEventListener("click", function () {
        if (window.JoviToast) window.JoviToast.show("Foto salva na galeria");
      });
    })();
  </script>
</body>
</html>
