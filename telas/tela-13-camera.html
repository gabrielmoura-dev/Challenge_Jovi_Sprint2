<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Câmera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/jullia-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-16.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <link rel="stylesheet" href="../assets/css/jovi-base.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <script src="../assets/js/jovi-ui.js"></script>
</head>
<body>
  <!--
    Nota: a tela 16 no Figma só existe em versão "no escuro" (câmera em
    fullscreen sobre foto). Não faz sentido um modo "light" aqui — o
    fundo é a própria foto/vídeo capturado, então omiti o toggle de tema
    nesta tela (mantê-lo criaria uma opção que não corresponde a nada
    no design real).

    Atualização: carrossel de pose ganhou tag de estilo por foto (em vez
    de sets separados por gênero — ver tela-22 para a justificativa).
    A pose dinâmica já aparece como guia branco sobre o preview normal
    da câmera, atrás de todos os controles, como no app Poze. As 4
    fotos de referência ainda são as originais do protótipo; são
    todas do mesmo enquadramento (retrato/beleza), então a diversidade
    de "estilo" aqui é só demonstrativa até entrar fotografia nova.
  -->

  <div class="phone-shell">
    <main class="phone-frame p-0">
      <div class="camera-frame">
        <img src="../assets/img/camera-bg.png" alt="Pré-visualização da câmera" class="camera-bg">
        <div class="camera-content">
          <!-- Status bar -->
          <div class="jovi-statusbar" style="background:rgba(10,10,10,0.4);">
            <span>17:32</span>
            <div class="d-flex align-items-center gap-1">
              <img src="../assets/img/status-signal.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-wifi.svg" alt="" style="filter:brightness(0) invert(1);">
              <img src="../assets/img/status-battery.svg" alt="" style="height:14px;filter:brightness(0) invert(1);">
            </div>
          </div>

          <!-- Barra de ferramentas superior -->
          <div class="camera-topbar">
            <div class="d-flex align-items-center gap-2">
              <button type="button" class="camera-chip" aria-label="Modo pose">
                <img src="../assets/img/cam-pose-badge.png" alt="">
                <span style="color:#a275b7;">POSE</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Guia">
                <img src="../assets/img/cam-book.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Melhorias IA">
                <img src="../assets/img/cam-sparkle.svg" alt="">
              </button>
              <button type="button" class="camera-chip" aria-label="Resolução 200 megapixels">
                <img src="../assets/img/cam-mp-badge.png" alt="">
                <span>200 mp</span>
              </button>
              <button type="button" class="camera-chip" aria-label="Flash">
                <img src="../assets/img/cam-lightning.svg" alt="">
              </button>
              <button type="button" class="camera-chip camera-chip--toggle" aria-label="Guia por voz" aria-pressed="false" data-voice-toggle>
                <img src="../assets/img/mic.svg" alt="" style="filter:brightness(0) invert(1);">
              </button>
            </div>
            <button type="button" class="camera-chip" aria-label="Configurações">
              <img src="../assets/img/cam-settings.svg" alt="">
            </button>
          </div>

          <!-- Miniaturas de pose: cada uma leva ao guia de silhueta (tela 22)
               com a pose escolhida. Tag de estilo no lugar de sets por
               gênero — ver nota no topo do arquivo. -->
          <div class="camera-thumbs">
            <button type="button" class="camera-thumb-item" onclick="joviNavegar('tela-35-guia-pose-silhueta.html?pose=0')">
              <img src="../assets/img/camera-thumb-1.png" alt="Pose dinâmica, mãos no rosto">
              <span class="camera-thumb-tag">Dinâmica</span>
            </button>
            <button type="button" class="camera-thumb-item" onclick="joviNavegar('tela-35-guia-pose-silhueta.html?pose=1')">
              <img src="../assets/img/camera-thumb-2.png" alt="Pose clássica, olhando por cima dos óculos">
              <span class="camera-thumb-tag">Clássica</span>
            </button>
            <button type="button" class="camera-thumb-item" onclick="joviNavegar('tela-35-guia-pose-silhueta.html?pose=2')">
              <img src="../assets/img/camera-thumb-3.png" alt="Pose editorial, corpo de perfil">
              <span class="camera-thumb-tag">Editorial</span>
            </button>
          </div>

          <!-- Barra inferior -->
          <div class="camera-bottom">
            <!-- Faixa de modos: rótulos, ordem e destinos vêm de
                 assets/js/camera-modes.js (fonte única do protótipo). -->
            <div class="jovi-modes" data-camera-modes="gerais" data-modo-ativo="foto"></div>

            <div class="camera-shutter-row">
              <button type="button" class="camera-side-btn" aria-label="Abrir galeria" onclick="joviNavegar('tela-06-galeria.html')">
                <img src="../assets/img/cam-gallery-icon.svg" alt="" style="width:24px;height:24px;">
              </button>
              <button type="button" class="camera-shutter" data-camera-shutter aria-label="Capturar foto" data-toast="Foto salva na galeria">
                <span class="camera-shutter-inner"></span>
              </button>
              <button type="button" class="camera-side-btn" aria-label="Alternar câmera" style="background:transparent;border:none;">
                <img src="../assets/img/cam-flip.svg" alt="" style="width:56px;height:56px;">
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/jovi.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script>
    // Preferência de guia por voz: liga/desliga aqui e persiste pra tela
    // 22 (guia de silhueta) refletir o mesmo estado ao navegar.
    (function () {
      var toggle = document.querySelector('[data-voice-toggle]');
      if (!toggle) return;
      var isOn = sessionStorage.getItem('jovi-voice-guide') === 'on';
      function render() {
        toggle.classList.toggle('is-on', isOn);
        toggle.setAttribute('aria-pressed', String(isOn));
      }
      toggle.addEventListener('click', function () {
        isOn = !isOn;
        sessionStorage.setItem('jovi-voice-guide', isOn ? 'on' : 'off');
        render();
      });
      render();
    })();
  </script>
  <script src="../assets/js/camera-modes.js"></script>
</body>
</html>
