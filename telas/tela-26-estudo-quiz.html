<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Quiz de limites</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/estudo-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-26.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
</head>
<body>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame estudo-tela tela-26">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <div class="estudo-sessao-topo">
        <button type="button" class="estudo-fechar" aria-label="Sair da sessão" onclick="joviNavegar('tela-25-estudo-roleta.html')">
          <img src="../assets/img/estudo-fechar.svg" alt="">
        </button>
        <div class="estudo-progresso">
          <div class="estudo-progresso-barra" style="width: 67%;"></div>
        </div>
        <span class="estudo-combo">×2</span>
      </div>

      <div class="estudo-scroll">
        <div class="estudo-origem">
          <span class="estudo-origem-thumb">
            <img src="../assets/img/estudo-origem-quadro.png" alt="">
          </span>
          <span class="estudo-origem-texto">
            <span class="estudo-origem-titulo d-block">Foto 1 do seu quadro</span>
            <span class="estudo-origem-sub d-block">Cálculo · Capítulo 5</span>
          </span>
          <img src="../assets/img/estudo-sparkle.svg" alt="" class="estudo-origem-ia">
        </div>

        <div class="enunciado-bloco">
          <p class="estudo-kicker">Limites</p>
          <h2 class="estudo-enunciado">Quanto vale o limite de (x² − 4) / (x − 2) quando x tende a 2?</h2>
        </div>

        <div class="alternativas">
          <button type="button" class="alternativa" data-opcao="incorreta">
            <span class="alternativa-letra">A</span>
            <span class="alternativa-texto">0</span>
            <img src="../assets/img/estudo-check.svg" alt="" class="alternativa-marca">
          </button>
          <button type="button" class="alternativa" data-opcao="incorreta">
            <span class="alternativa-letra">B</span>
            <span class="alternativa-texto">2</span>
            <img src="../assets/img/estudo-check.svg" alt="" class="alternativa-marca">
          </button>
          <button type="button" class="alternativa" data-opcao="correta">
            <span class="alternativa-letra">C</span>
            <span class="alternativa-texto">4</span>
            <img src="../assets/img/estudo-check.svg" alt="" class="alternativa-marca">
          </button>
          <button type="button" class="alternativa" data-opcao="incorreta">
            <span class="alternativa-letra">D</span>
            <span class="alternativa-texto">Não existe</span>
            <img src="../assets/img/estudo-check.svg" alt="" class="alternativa-marca">
          </button>
        </div>

        <div class="estudo-feedback" data-feedback data-titulo-erro="Ainda não." data-texto-erro="A resposta certa é 4: fatorando o numerador, (x² − 4)/(x − 2) vira x + 2 para todo x ≠ 2." hidden>
          <p class="estudo-feedback-titulo">Certo.</p>
          <p class="estudo-feedback-texto">Fatorando o numerador, (x² − 4)/(x − 2) vira x + 2 para todo x ≠ 2. Substituindo, 2 + 2 = 4.</p>
        </div>
      </div>

      <div class="estudo-rodape">
        <button type="button" class="estudo-btn" data-proxima onclick="joviNavegar('tela-27-estudo-caca-erro.html')">Próxima</button>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/estudo-jogo.js"></script>
</body>
</html>
