<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOVI · Modo Farol — Ativação</title>

<!--
  Nota: assim como o Modo Blindagem (Tela 22), esta é uma tela de sistema
  (a tela de bloqueio), não uma tela do app — não existe variante light,
  então o tema fica fixo em dark.

  Ajuste em relação ao rascunho: a moldura de cantos (âmbar) foi trocada
  por um indicador bem mais discreto — um ponto roxo na barra de status
  com uma lavagem de luz suave logo abaixo dela, o mesmo tipo de sinal que
  o sistema usa para avisar câmera/microfone em uso, na cor da marca.
-->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/lacar-componentes.css">
<link rel="stylesheet" href="../assets/css/telas/tela-24.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
  <link rel="stylesheet" href="../assets/css/jovi-story.css">
</head>
<body>
  <a href="../index.html" class="theme-toggle" style="right: 16px; left: auto; text-decoration:none;">← Telas</a>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame tela-24">
      <div class="lock-topwash" id="topwash"></div>

      <div class="lock-status">
        <span>sáb, 29 ago</span>
        <div class="lock-status__icons">
          <span class="lock-indicator" id="indicator" aria-hidden="true"></span>
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="">
        </div>
      </div>

      <div class="lock-clock">
        <span class="time">23:41</span>
        <span class="date">72% de bateria</span>
      </div>

      <div class="lock-brand">JOVI</div>

      <p class="lock-hint" id="lockHint">
        <b>Nada aqui sugere o que está prestes a acontecer.</b>
        Toque três vezes no botão abaixo para simular o gesto — na vida real, é o botão físico de volume, com a tela travada.
      </p>

      <button type="button" class="lock-tap-target" id="simulateBtn">Simular 3× volume</button>

      <div class="lock-next" id="lockNext">
        <a href="tela-21-modo-farol-contato.html">Ver como chega para a Marina →</a>
      </div>
    </main>
  </div>

  <script src="../assets/js/tela24.js"></script>
  <script src="../assets/js/jovi-story.js"></script>
</body>
</html>
