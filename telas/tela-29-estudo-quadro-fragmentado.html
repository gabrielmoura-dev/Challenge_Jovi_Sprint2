<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVI · Quadro fragmentado</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") {
        saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
  <link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/lacar-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/estudo-componentes.css">
  <link rel="stylesheet" href="../assets/css/telas/tela-29.css">
  <link rel="stylesheet" href="../assets/css/jovi-transitions.css">
  <script src="../assets/js/jovi-transicao.js"></script>
</head>
<body>

  <div class="lacar-phone-shell">
    <main class="lacar-phone-frame estudo-tela tela-29">
      <div class="lacar-statusbar">
        <span>17:32</span>
        <div class="d-flex align-items-center gap-1">
          <img src="../assets/img/status-signal.svg" alt="">
          <img src="../assets/img/status-wifi.svg" alt="">
          <img src="../assets/img/status-battery.svg" alt="" style="height:14px;">
        </div>
      </div>

      <header class="estudo-header">
        <button type="button" class="estudo-back" aria-label="Voltar" onclick="joviNavegar('tela-25-estudo-roleta.html')">
          <img src="../assets/img/estudo-chevron-left.svg" alt="">
        </button>
        <div class="estudo-header-text">
          <h1 class="estudo-title">Quadro fragmentado</h1>
        </div>
      </header>

      <div class="estudo-scroll">
        <p class="investigacao-label">Investigação · 1 de 2</p>

        <div class="estudo-dica">
          <img src="../assets/img/estudo-sparkle.svg" alt="">
          <p>Toque nas fotos na ordem em que os traços se conectam. Uma seta cortada em um registro continua no seguinte.</p>
        </div>

        <section class="recortes-secao">
          <h2 class="recortes-label">Os três recortes</h2>
          <div class="recortes">
            <button type="button" class="recorte" data-recorte="a">
              <img src="../assets/img/estudo-recorte-a.png" alt="">
              <span class="recorte-nome">Foto A</span>
            </button>
            <button type="button" class="recorte" data-recorte="b">
              <img src="../assets/img/estudo-recorte-b.png" alt="">
              <span class="recorte-nome">Foto B</span>
            </button>
            <button type="button" class="recorte" data-recorte="c">
              <img src="../assets/img/estudo-recorte-c.png" alt="">
              <span class="recorte-nome">Foto C</span>
            </button>
          </div>
        </section>

        <section class="reconstrucao-secao">
          <h2 class="recortes-label">Sua reconstrução</h2>
          <p class="reconstrucao-contador"><span data-contador>0</span> de 3 fotos posicionadas</p>
          <div class="slots">
            <span class="slot" data-slot="1">1</span>
            <span class="slot" data-slot="2">2</span>
            <span class="slot" data-slot="3">3</span>
          </div>
        </section>
      </div>

      <div class="estudo-rodape">
        <button type="button" class="estudo-btn" data-verificar disabled>Verificar conexões</button>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/estudo-quadro.js"></script>
</body>
</html>
