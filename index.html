<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOVI Vision — Onboarding</title>

  <!--
    ATENÇÃO — FONTE PROVISÓRIA
    O design original (Figma) usa a fonte customizada "JOVI_Sans_CN" (Regular/Bold),
    mas os arquivos da fonte não estão disponíveis no arquivo Figma.
    Estamos usando "Inter" (Google Fonts) como fallback temporário.
    TODO: trocar por JOVI_Sans_CN assim que os arquivos (.woff2) forem fornecidos.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Banner de dev: remover quando a fonte oficial for aplicada -->
  <!-- <div class="alert alert-warning dev-font-alert mb-0 rounded-0 text-center py-2 small" role="alert">
    ⚠️ Fonte provisória: usando <strong>Inter</strong> no lugar de <strong>JOVI_Sans_CN</strong> (arquivos ainda não fornecidos).
  </div> -->

  <main class="onboarding-wrapper">
    <div class="onboarding-screen" data-node-id="109:618" data-name="Tela 1">

      <img src="assets/img/onboarding-bg.png" alt="" class="onboarding-bg" data-node-id="109:619">
      <div class="onboarding-gradient" data-node-id="109:620"></div>

      <!-- Status bar -->
      <div class="status-bar d-flex justify-content-between align-items-center" data-node-id="150:4243">
        <span class="status-time">17:32</span>
        <div class="status-icons d-flex align-items-center gap-2">
          <img src="assets/img/icon-signal.svg" alt="" class="status-icon">
          <img src="assets/img/icon-wifi.svg" alt="" class="status-icon">
          <div class="battery-icon">
            <img src="assets/img/battery-vector1.svg" alt="" class="battery-body">
            <img src="assets/img/battery-vector2.svg" alt="" class="battery-tip">
          </div>
        </div>
      </div>

      <!-- TODO: substituir por logo oficial JOVI_Sans_CN quando os arquivos de fonte chegarem -->
      <h1 class="onboarding-heading" data-node-id="109:621" data-name="Heading 1">JOVI</h1>

      <p class="onboarding-paragraph" data-node-id="109:624">
        Inteligência artificial para <br>
        suas fotos perfeitas
      </p>

      <button type="button" class="btn btn-onboarding-primary" data-node-id="109:625">Começar</button>
      <button type="button" class="btn btn-onboarding-secondary" data-node-id="109:627">Pular</button>

      <div class="onboarding-dots d-flex align-items-center justify-content-center gap-2" data-node-id="150:4268">
        <span class="dot dot-active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
